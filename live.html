function teamWinnerBlockHtml(field, holeRow, hole, aLabel, bLabel, extraBtnHtml, aColor, bColor) {
  const val = holeRow[field] || '';
  return `<div class="wpick-block">${winnerButtonsHtml(field, val, aLabel, bLabel, extraBtnHtml, aColor, bColor, ` Hole ${hole}`)}</div>`;
}
// Player-vs-player pick (Day 2 Individual Match Play, one block per MP slot).
// extraBtnHtml (optional) is appended into the same button row. aColor/bColor
// (optional) mark which team each player belongs to with a small dot, since
// this is otherwise a player-vs-player screen with no team names in sight.
// Only ever used from hole-by-hole entry, same as teamWinnerBlockHtml above.
function matchupWinnerBlockHtml(field, holeRow, hole, aName, bName, extraBtnHtml, aColor, bColor) {
  const val = holeRow[field] || '';
  const aLabel = lastNameOrUnassigned(aName), bLabel = lastNameOrUnassigned(bName);
  const aDot = aColor ? teamDotHtml(aColor) : '';
  const bDot = bColor ? teamDotHtml(bColor) : '';
  return `<div class="wpick-block"><div class="wpick-sides"><div class="wpick-side">${aDot}${escapeHtml(aLabel)}${playerStrokeNoteHtml(aName, hole)}</div><div class="wpick-side">${bDot}${escapeHtml(bLabel)}${playerStrokeNoteHtml(bName, hole)}</div></div>${winnerButtonsHtml(field, val, aLabel, bLabel, extraBtnHtml, aColor, bColor, ` Hole ${hole}`)}</div>`;
}

// ---- "Enter Match Winner" mode: one person per team declares each 9's (or
// each Match Play pairing's) overall outcome directly, with no hole-by-hole
// entry at all. Implemented without any backend/schema change: picking a
// winner just writes that same value across every hole in the segment's
// 9-hole range through the existing per-hole Winner/BestBallWinner/
// MP#Winner fields, then saves through the same saveMatchScores endpoint
// hole-by-hole entry already uses — every existing tally/status/scorecard
// helper reads the result the same way either way, no matter how it got
// entered.
let scEntryMode = 'holebyhole'; // 'holebyhole' | 'matchwinner' — page-level UI choice, not saved anywhere
// Re-renders whichever entry view is currently selected, for a match already
// known to be picked/unlocked/unlocked-for-editing — used both by the
// top-level dispatcher (renderScoringUI) and by anything (like a verified
// save) that needs to refresh the visible entry UI without redoing the
// PIN/day-lock checks that got it on screen in the first place.
function renderCurrentEntryView(day, matchNum) {
  if (scEntryMode === 'matchwinner') {
    renderMatchWinnerMode(day, matchNum);
  } else {
    renderHoleByHole(day, matchNum);
  }
}
function scModeToggleHtml() {
  return `
    <p class="sc-intro-label">2. Choose whether you want to enter hole-by-hole scores or just the match winner.</p>
    <button type="button" class="view-toggle-btn ${scEntryMode === 'holebyhole' ? 'active' : ''}" onclick="setScEntryMode('holebyhole')">Hole-by-Hole</button>
    <button type="button" class="view-toggle-btn ${scEntryMode === 'matchwinner' ? 'active' : ''}" onclick="setScEntryMode('matchwinner')">Enter Match Winner</button>
  `;
}
function setScEntryMode(mode) {
  if (scEntryMode === mode) return;
  scEntryMode = mode;
  const day = document.getElementById('scDay').value;
  const matchNum = document.getElementById('scMatch').value;
  renderScoringUI(day, matchNum);
}
// Returns 'A' / 'B' / 'Half' / some other sentinel (e.g. 'Conceded') if every
// hole in the range already carries that exact same value, blank ('' -> null)
// if none of them are entered yet, or null if the holes are a genuine mix
// (real hole-by-hole progress) — which is exactly the case worth warning
// about before this mode overwrites it.
function isSegmentUniform(field, startHole, endHole) {
  let val = null;
  for (let h = startHole; h <= endHole; h++) {
    const v = (currentHoles[h - 1] || {})[field] || '';
    if (h === startHole) { val = v; continue; }
    if (v !== val) return null;
  }
  return val || null;
}
function segmentHasAnyEntry(field, startHole, endHole) {
  for (let h = startHole; h <= endHole; h++) {
    if ((currentHoles[h - 1] || {})[field]) return true;
  }
  return false;
}
// Applies a direct match-winner pick across an entire 9-hole segment. Tapping
// the pick that's already set for the whole segment clears it back to blank
// (an undo, mirroring the per-hole pick buttons' own toggle-off behavior);
// tapping anything else overwrites the whole segment — with a confirmation
// first if there's any existing entry there, real hole-by-hole progress
// included, so a scorekeeper can't lose that work with one stray tap.
function pickMatchWinner(day, matchNum, field, startHole, endHole, value) {
  const current = isSegmentUniform(field, startHole, endHole);
  if (current === value) {
    if (!confirm(`Clear this pick and go back to no result for holes ${startHole}–${endHole}?`)) return;
    for (let h = startHole; h <= endHole; h++) { if (currentHoles[h - 1]) currentHoles[h - 1][field] = ''; }
  } else {
    if (segmentHasAnyEntry(field, startHole, endHole)) {
      if (!confirm(`Holes ${startHole}–${endHole} already have scores entered for this segment. Overwrite them all with this pick?`)) return;
    }
    for (let h = startHole; h <= endHole; h++) { if (currentHoles[h - 1]) currentHoles[h - 1][field] = value; }
  }
  saveCurrentMatch(day, matchNum, currentHoles);
  renderScoringUI(day, matchNum);
}
function matchWinnerBlockHtml(field, startHole, endHole, label, aLabel, bLabel, aColor, bColor) {
  const current = isSegmentUniform(field, startHole, endHole);
  const hasAnyEntry = segmentHasAnyEntry(field, startHole, endHole);
  const noteHtml = (current === 'A' || current === 'B' || current === 'Half')
    ? `<span class="hint">Currently set: ${current === 'Half' ? 'Tie' : escapeHtml(current === 'A' ? aLabel : bLabel)} for the whole 9</span>`
    : hasAnyEntry
      ? `<span class="hint" style="color:#b8860b; font-weight:600;">This 9 already has scores entered — picking a winner below will overwrite them</span>`
      : `<span class="hint">Not yet entered</span>`;
  return `
    <div class="wpick-block mw-segment-block" data-field="${escapeHtml(field)}" data-start="${startHole}" data-end="${endHole}">
      <div class="hbh-seglabel">${escapeHtml(label)}</div>
      ${winnerButtonsHtml(field, current || '', aLabel, bLabel, '', aColor, bColor)}
      <div style="margin-top:4px;">${noteHtml}</div>
    </div>
  `;
}
function renderMatchWinnerMode(day, matchNum) {
  const wrap = document.getElementById('scGridWrap');
  const pairingRow = pairings[day].find((r) => String(r.MatchNum) === String(matchNum));
  const names = teamNames();
  const colors = teamColors();
  let blocksHtml;
  if (day === '2') {
    blocksHtml =
      matchWinnerBlockHtml('BestBallWinner', 1, 9, 'Front 9: Best Ball', teamWinLabel(names.A), teamWinLabel(names.B), colors.A, colors.B) +
      matchWinnerBlockHtml('MP1Winner', 10, 18, `Back 9: Match Play — ${lastNameOrUnassigned(pairingRow.MP1_TeamA)} vs ${lastNameOrUnassigned(pairingRow.MP1_TeamB)}`, lastNameOrUnassigned(pairingRow.MP1_TeamA), lastNameOrUnassigned(pairingRow.MP1_TeamB), colors.A, colors.B) +
      matchWinnerBlockHtml('MP2Winner', 10, 18, `Back 9: Match Play — ${lastNameOrUnassigned(pairingRow.MP2_TeamA)} vs ${lastNameOrUnassigned(pairingRow.MP2_TeamB)}`, lastNameOrUnassigned(pairingRow.MP2_TeamA), lastNameOrUnassigned(pairingRow.MP2_TeamB), colors.A, colors.B);
  } else {
    blocksHtml =
      matchWinnerBlockHtml('Winner', 1, 9, "Front 9: Captain's Choice", teamWinLabel(names.A), teamWinLabel(names.B), colors.A, colors.B) +
      matchWinnerBlockHtml('Winner', 10, 18, 'Back 9: Modified Alternate Shot', teamWinLabel(names.A), teamWinLabel(names.B), colors.A, colors.B);
  }
  // Shown for context even though this mode never navigates hole by hole —
  // matches the same line in Hole-by-Hole mode (see renderHoleByHole).
  const startHoleText = pairingRow && pairingRow.StartHole ? escapeHtml(String(pairingRow.StartHole)) : null;
  wrap.innerHTML = `
    <p class="sc-intro-label">3. Pick each 9's overall winner below.</p>
    ${startHoleText ? `<p class="hint" style="font-weight:600; margin:0 0 4px;">Your match is starting on Hole <span class="start-hole-badge">${startHoleText}</span></p>` : ''}
    <p class="hint" style="margin:0 0 8px;">No need to enter every hole — saves immediately when you tap a pick.</p>
    ${acceptResultsBannerHtml(day, matchNum, pairingRow, currentHoles)}
    ${blocksHtml}
  `;
  wrap.querySelectorAll('.mw-segment-block .wpick-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const block = btn.closest('.mw-segment-block');
      pickMatchWinner(day, matchNum, block.dataset.field, parseInt(block.dataset.start, 10), parseInt(block.dataset.end, 10), btn.dataset.wval);
    });
  });
  renderStatusLines(day, matchNum, pairingRow);
}

// What color (if any) a hole's dot should show, based on who's currently
// picked to win it — not its save state, which is tracked separately. Day 1
// and Day 2's front 9 (holes 0-8, 0-based) have a single result field, so
// this is a direct lookup. Day 2's back 9 (holes 9-17) runs two separate
// Individual Match Play matchups at once (MP1Winner, MP2Winner) that can
// have different winners on the same hole — when they agree, one solid
// color; when they disagree, a diagonal split so neither result is hidden;
// when only one of the two has been entered so far, that one's color alone.
function holeResultColor(day, idx) {
  const holeRow = currentHoles[idx];
  if (!holeRow) return null;
  const colors = teamColors();
  const colorFor = (v) => (v === 'A' ? colors.A : v === 'B' ? colors.B : v === 'Half' ? 'var(--half)' : null);
  if (day === '2' && idx >= 9) {
    const c1 = colorFor(holeRow.MP1Winner);
    const c2 = colorFor(holeRow.MP2Winner);
    if (c1 && c2) return c1 === c2 ? c1 : `linear-gradient(135deg, ${c1} 50%, ${c2} 50%)`;
    return c1 || c2 || null;
  }
  const field = day === '2' ? 'BestBallWinner' : 'Winner';
  return colorFor(holeRow[field]);
}

// Compact 18-dot map of this match's holes — click any dot to jump there,
// same as the dropdown. Once a hole has a winner (or Tie) picked, its dot is
// filled with that team's color (see holeResultColor above); a hole with
// nothing entered yet stays plain grey. Independently, the border shows
// whether that pick is confirmed saved: dashed/amber for entered-but-not-
// yet-confirmed (still mid-autosave-debounce, or a save attempt errored),
// solid for confirmed in the sheet as of the last load or successful save.
// That's what actually answers "did that stick" at a glance, rather than
// only the one-line indicator up top which only reflects the very last save
// attempt.
function holeCompletionStripHtml(day, matchNum) {
  const dots = Array.from({ length: 18 }, (_, i) => {
    const state = holeSaveState(day, matchNum, i);
    const current = i === scHoleIndex ? ' hbh-progress-current' : '';
    const resultColor = holeResultColor(day, i);
    const decidedCls = resultColor ? ' hbh-progress-decided' : '';
    const style = resultColor ? ` style="background:${resultColor};"` : '';
    return `<div class="hbh-progress-dot hbh-progress-${state}${decidedCls}${current}"${style} data-hole-idx="${i}" title="Hole ${i + 1}${state === 'saved' ? ' — saved' : state === 'unsaved' ? ' — entered, not yet confirmed saved' : ' — not entered'}">${i + 1}</div>`;
  });
  return `<div class="hbh-progress-strip">${dots.join('')}</div>`;
}

// One hole at a time — just this match's players/teams, big touch-friendly
// tap targets, no horizontal scrolling. The nav row (‹ and the hole
// dropdown) sits above the pick buttons; the "Save and move to hole N"
// button rides on the same line as the last (or only) winner-pick row so
// all four buttons read as one unit. Picking a result never moves you on
// by itself — only that explicit button does, so you can review a hole
// before committing to the next one. Prev (‹) and the dropdown just
// navigate without forcing a save first.
function renderHoleByHole(day, matchNum) {
  const wrap = document.getElementById('scGridWrap');
  const pairingRow = pairings[day].find((r) => String(r.MatchNum) === String(matchNum));
  const names = teamNames();
  const colors = teamColors();
  const h = scHoleIndex + 1; // 1-based hole number
  const nextH = (h % 18) + 1; // wraps 18 -> 1, same as stepHole(1)
  const holeRow = currentHoles[scHoleIndex];
  const segLabelPlain = h <= 9
    ? (day === '2' ? 'Best Ball (front 9)' : "Captain's Choice (front 9)")
    : (day === '2' ? 'Individual Match Play (back 9)' : 'Modified Alternate Shot (back 9)');
  // On the very first hole of a new segment (hole 1 or hole 10 — the turn),
  // call out the format change explicitly rather than just naming it, since
  // that's the one moment a scorekeeper might not realize the rules just
  // switched (e.g. Captain's Choice giving way to Modified Alternate Shot).
  const segLabel = (h === 1 || h === 10) ? `You are now playing ${segLabelPlain}` : segLabelPlain;
  const saveBtnHtml = `<button type="button" class="hbh-save-next" onclick="saveAndAdvance('${day}', '${matchNum}')">Save now and move to hole ${nextH}</button>`;
  // Day 2 Individual Match Play (back 9) only: one Save covers both MP1 and
  // MP2 at once (they're saved together, same as every other segment), so
  // its own label says so explicitly rather than reading like it only
  // covers the matchup it's visually closest to.
  const saveBtnHtmlBothMatches = `<button type="button" class="hbh-save-next" onclick="saveAndAdvance('${day}', '${matchNum}')">Save results for both matches now and move to hole ${nextH}</button>`;
  // The dropdown just below already jumps straight to this match's own Start
  // Hole (see onScMatchSelected) — this line just says so in plain words,
  // for anyone who'd otherwise wonder why it's not showing hole 1.
  const startHoleText = pairingRow && pairingRow.StartHole ? escapeHtml(String(pairingRow.StartHole)) : null;

  let blocksHtml;
  if (day === '2') {
    if (h <= 9) {
      blocksHtml = teamWinnerBlockHtml('BestBallWinner', holeRow, h, teamWinLabel(names.A), teamWinLabel(names.B), saveBtnHtml, colors.A, colors.B);
    } else {
      // Both matchups render with the same 3-button row (no extra button on
      // either one), so MP1 and MP2 look identical — the save button gets
      // its own centered line below the second matchup instead, labeled to
      // say it covers both matches since it's not obviously tied to just
      // the one it sits under.
      blocksHtml = matchupWinnerBlockHtml('MP1Winner', holeRow, h, pairingRow.MP1_TeamA, pairingRow.MP1_TeamB, null, colors.A, colors.B)
        + matchupWinnerBlockHtml('MP2Winner', holeRow, h, pairingRow.MP2_TeamA, pairingRow.MP2_TeamB, null, colors.A, colors.B)
        + `<div class="hbh-save-standalone">${saveBtnHtmlBothMatches}</div>`;
    }
  } else {
    blocksHtml = teamWinnerBlockHtml('Winner', holeRow, h, teamWinLabel(names.A), teamWinLabel(names.B), saveBtnHtml, colors.A, colors.B);
  }

  // A mirror of this one match's Scoreboard → All Match Scorecards entry,
  // right here on the entry screen — reads straight off `currentHoles`, the
  // same in-memory data the pick buttons and status lines use, so it
  // updates the instant you tap something rather than only after a save.
  const { segs: mirrorSegs, segNames: mirrorSegNames } = segmentInfoFromHoles(day, pairingRow, currentHoles);
  const mirrorScorecardHtml = `
    <div class="hbh-mirror-scorecard">
      <div class="hbh-mirror-title">This Match's Scorecard</div>
      ${scorecardProgRowsHtml(day, pairingRow, currentHoles, mirrorSegs, mirrorSegNames)}
    </div>
  `;

  // If a segment tapped into "decided, but holes still to enter" earlier and
  // hasn't been resolved (Concede or Continue Playing) yet, show the banner
  // on every render of this match — not just the one where it first
  // triggered — so it isn't easy to miss by navigating to a different hole
  // in the meantime. Re-checked against live data each render, so if the
  // segment somehow becomes undecided again (a pick toggled back off) the
  // banner quietly clears itself instead of lingering stale.
  let concedeBannerHtml = '';
  if (!concedeEnabled()) {
    // Feature turned off in Settings — never show it, and clear out any
    // pending banner from before it was turned off (e.g. mid-round) so a
    // stale one can't reappear if it's switched back on later without this
    // match's outcome changing again first.
    concedeBannerFor = null;
  } else if (concedeBannerFor && concedeBannerFor.day === day && String(concedeBannerFor.matchNum) === String(matchNum)) {
    const segResult = segmentResultForField(day, concedeBannerFor.field, concedeBannerFor.hole, pairingRow, currentHoles);
    if (segResult.clinched && !segResult.final) {
      const leaderName = segResult.leader === 'A' ? names.A : segResult.leader === 'B' ? names.B : '';
      concedeBannerHtml = `
        <div class="concede-banner">
          <div class="concede-banner-title">Match outcome determined. Concede or continue playing?</div>
          <div class="concede-banner-detail">${escapeHtml(leaderName)} ${escapeHtml(segResult.text)}</div>
          <div class="concede-banner-actions">
            <button type="button" class="concede-btn concede-yes" onclick="concedeSegment('${day}', '${matchNum}', '${concedeBannerFor.field}')">Concede</button>
            <button type="button" class="concede-btn concede-no" onclick="dismissConcedeBanner('${day}', '${matchNum}')">Continue Playing</button>
          </div>
        </div>
      `;
    } else {
      concedeBannerFor = null;
    }
  }

  wrap.innerHTML = `
    <p class="sc-intro-label">3. Select Winner (or Tie) below and advance to the next hole.</p>
    ${startHoleText ? `<p class="hint" style="font-weight:600; margin:0 0 8px;">Your match is starting on Hole <span class="start-hole-badge">${startHoleText}</span></p>` : ''}
    <div class="hbh-nav">
      <button type="button" onclick="stepHole(-1)">‹</button>
      <select id="hbhHoleSelect" onchange="jumpToHole(this.value)">
        ${Array.from({ length: 18 }, (_, i) => {
          const p = parForHole(i + 1);
          return `<option value="${i}" ${i === scHoleIndex ? 'selected' : ''}>Hole ${i + 1}${p ? ` (Par ${escapeHtml(String(p))})` : ''}</option>`;
        }).join('')}
      </select>
    </div>
    ${holeCompletionStripHtml(day, matchNum)}
    ${concedeBannerHtml}
    ${acceptResultsBannerHtml(day, matchNum, pairingRow, currentHoles)}
    <div class="hbh-seglabel">${escapeHtml(segLabel)}</div>
    ${blocksHtml}
    <p class="hint" style="margin-top:10px;">Results still autosave a couple seconds after your last tap, or hit "Save now and move to hole ${nextH}" to save right away and move on. On a shotgun start, jump straight to whichever hole your group just finished — Prev and the dropdown just navigate, they don't move any faster than that. The row of hole numbers above shows what's actually confirmed: grey means nothing's entered yet; once a hole has a winner (or Tie), its number fills with that team's color — a dashed border means it's entered here but not yet confirmed saved, a solid border means it's saved — tap any number to jump to that hole.</p>
    ${mirrorScorecardHtml}
  `;

  wrap.querySelectorAll('.hbh-progress-dot').forEach((dot) => {
    dot.addEventListener('click', () => jumpToHole(dot.dataset.holeIdx));
  });

  wrap.querySelectorAll('.wpick-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const field = btn.dataset.wfield;
      const val = btn.dataset.wval;
      const before = segmentResultForField(day, field, h, pairingRow, currentHoles);
      const current = currentHoles[scHoleIndex][field];
      // Tapping the already-selected choice clears it back to "not entered".
      currentHoles[scHoleIndex][field] = current === val ? '' : val;
      const after = segmentResultForField(day, field, h, pairingRow, currentHoles);
      // Newly clinched (wasn't decided before this tap, is now, with holes
      // still left blank) — surface the Concede-or-continue banner. Already
      // being clinched before this tap doesn't re-trigger it (so re-tapping
      // other holes in an already-decided segment doesn't keep re-showing
      // it), and un-clinching it (toggling a pick back off) clears it.
      if (after.clinched && !after.final) {
        if (!before.clinched && concedeEnabled()) concedeBannerFor = { day, matchNum, field, hole: h };
      } else if (concedeBannerFor && concedeBannerFor.day === day && String(concedeBannerFor.matchNum) === String(matchNum) && concedeBannerFor.field === field) {
        concedeBannerFor = null;
      }
      renderHoleByHole(day, matchNum);
      renderStatusLines(day, matchNum, pairingRow);
      scheduleAutosave(day, matchNum);
    });
  });

  renderStatusLines(day, matchNum, pairingRow);
}

// "Continue Playing" — just dismiss the banner, no other side effects; the
// scorer keeps entering real results as normal.
function dismissConcedeBanner(day, matchNum) {
  concedeBannerFor = null;
  renderHoleByHole(day, matchNum);
}

// "Concede" — fills every not-yet-entered hole in the conceded segment with
// a 'Conceded' sentinel (the same Winner/BestBallWinner/MP1Winner/MP2Winner
// column the real picks live in, so no schema change and every existing
// tally/display helper handles it via normalizeWinner), saves it, and moves
// on. A front-9 segment (Day 1 Captain's Choice, or Day 2 Best Ball) jumps
// ahead to hole 10 to start the next segment; a back-9 segment (Day 1
// Modified Alt Shot, or either Day 2 Match Play sub-match) just stops where
// it is — it's either the day's last segment, or (Day 2 back 9) the sibling
// Match Play sub-match is still being played on these same holes.
function concedeSegment(day, matchNum, field) {
  const isFrontNine = day === '2' ? field === 'BestBallWinner' : !(concedeBannerFor && concedeBannerFor.hole > 9);
  const startHole = isFrontNine ? 1 : 10;
  const endHole = isFrontNine ? 9 : 18;
  for (let h = startHole; h <= endHole; h++) {
    const row = currentHoles[h - 1];
    if (row && !row[field]) row[field] = 'Conceded';
  }
  concedeBannerFor = null;
  saveCurrentMatch(day, matchNum, currentHoles);
  if (isFrontNine) {
    jumpToHole(9); // hole 10 (0-based index 9) — start of the next segment
  } else {
    renderHoleByHole(day, matchNum);
  }
}

// The nav row's primary action — saves whatever's on screen right now
// (bypassing the autosave debounce) and then moves ahead to the next hole,
// wrapping 18 -> 1 same as stepHole(1).
function saveAndAdvance(day, matchNum) {
  saveCurrentMatch(day, matchNum, currentHoles);
  stepHole(1);
}

// Wraps 18 -> 1 and 1 -> 18 rather than stopping at the ends — a shotgun
// group finishing on hole 18 naturally continues into hole 1 next, and the
// format flips there (front 9 <-> back 9), which the heading above already
// makes clear.
function stepHole(dir) {
  scHoleIndex = (scHoleIndex + dir + 18) % 18;
  const day = document.getElementById('scDay').value;
  const matchNum = document.getElementById('scMatch').value;
  renderHoleByHole(day, matchNum);
}
function jumpToHole(idx) {
  scHoleIndex = parseInt(idx, 10) || 0;
  const day = document.getElementById('scDay').value;
  const matchNum = document.getElementById('scMatch').value;
  renderHoleByHole(day, matchNum);
}

function scheduleAutosave(day, matchNum) {
  setSaveIndicator('saving', 'Saving…');
  const key = day + '_' + matchNum;
  clearTimeout(saveTimers[key]);
  // Capture the array reference now, not just the day/matchNum. Further edits
  // to this same match before the timer fires keep mutating this same array
  // (so the save 1.5s from now still includes them) — but if you switch to a
  // different match, `currentHoles` gets reassigned to a new array for that
  // match, and this timer's captured reference is unaffected by that, so it
  // still saves this match's own data, not whatever's now on screen.
  const holesSnapshot = currentHoles;
  saveTimers[key] = setTimeout(() => {
    delete saveTimers[key];
    saveCurrentMatch(day, matchNum, holesSnapshot);
  }, 1500);
}
function setSaveIndicator(cls, text) {
  const el = document.getElementById('saveIndicator');
  el.className = 'save-indicator ' + cls;
  el.textContent = text;
}
// Always called with explicit day/matchNum/holes — by a debounced autosave
// (see scheduleAutosave) or by the per-hole "Save now and move to hole N"
// button — so it always saves the specific match/data it was scheduled for,
// regardless of what's currently selected, and only touches the visible
// Saving/Saved indicator if that same match still happens to be the one on
// screen. The day/matchNum/holes fallbacks below (reading straight off the
// dropdowns/currentHoles) are just defensive — nothing currently calls this
// without arguments — in case something ever does again.
//
// Two safety nets on top of the original single attempt:
//  - a transient failure (network hiccup, a timeout, or a save that posted
//    but didn't verify) retries automatically, with a short backoff, before
//    giving up — so one blip mid-round doesn't permanently lose an entry
//    behind a small error indicator nobody happens to notice.
//  - if this SAME match gets saved again (autosave firing, "Save now", or a
//    retry) while an earlier save for it is still talking to the server,
//    this doesn't fire a second overlapping request — their responses could
//    land out of order and let a stale one overwrite what the newer one just
//    confirmed. The newer snapshot is queued instead and sent the moment the
//    in-flight one finishes, so no edit is ever silently dropped.
async function saveCurrentMatch(day, matchNum, holes) {
  if (day === undefined) day = document.getElementById('scDay').value;
  if (matchNum === undefined) matchNum = document.getElementById('scMatch').value;
  if (holes === undefined) holes = currentHoles;
  if (!matchNum) return;
  const key = day + '_' + matchNum;
  clearTimeout(saveTimers[key]);
  delete saveTimers[key];

  if (inFlightSaves[key]) {
    queuedSaves[key] = { day, matchNum, holes };
    return;
  }
  inFlightSaves[key] = true;
  try {
    await saveCurrentMatchNow_(day, matchNum, holes, key);
  } finally {
    delete inFlightSaves[key];
    const queued = queuedSaves[key];
    if (queued) {
      delete queuedSaves[key];
      saveCurrentMatch(queued.day, queued.matchNum, queued.holes);
    }
  }
}

async function saveCurrentMatchNow_(day, matchNum, holes, key) {
  const prevHoles = lastSavedHolesByMatch[key]; // snapshot from before this save, for checkPlacardPickup below
  const isCurrentlyViewed = () => String(document.getElementById('scDay').value) === String(day) && String(document.getElementById('scMatch').value) === String(matchNum);
  if (isCurrentlyViewed()) setSaveIndicator('saving', 'Saving…');
  const maxAttempts = 3;
  let lastErrorText = 'Network error';
  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    try {
      const res = await apiPost('saveMatchScores', { day, matchNum, holes: JSON.stringify(holes) });
      if (!res.success) {
        lastErrorText = res.error || 'Save failed';
      } else if (holesMatchServerRows(day, holes, res.data)) {
        // Don't just trust "success" from the API call — check what the sheet
        // actually ended up holding (returned right after the write) matches
        // what we sent, so a save that silently didn't stick shows as an error
        // here and now instead of only surfacing later as "the hole came back
        // blank."
        lastSavedHolesByMatch[key] = cloneHoles(holes);
        checkPlacardPickup(day, matchNum, prevHoles, holes);
        if (isCurrentlyViewed()) { setSaveIndicator('saved', 'Saved ✓'); renderCurrentEntryView(day, matchNum); }
        return;
      } else {
        lastErrorText = 'Save didn’t verify — try again';
      }
    } catch (err) {
      lastErrorText = 'Network error';
    }
    if (attempt < maxAttempts) await new Promise((r) => setTimeout(r, 600 * attempt));
  }
  if (isCurrentlyViewed()) setSaveIndicator('error', lastErrorText);
}

// live status line(s) shown above the grid as you type, computed entirely client-side
function renderStatusLines(day, matchNum, pairingRow) {
  const names = teamNames();
  const el = document.getElementById('scStatusLines');
  if (day === '2') {
    const bb = computeDay2BestBall(pairingRow, currentHoles);
    const mp1 = computeDay2MatchPlay(pairingRow, currentHoles, 1);
    const mp2 = computeDay2MatchPlay(pairingRow, currentHoles, 2);
    el.innerHTML = [
      statusLineHtml('Best Ball (front 9)', bb, names.A, names.B),
      statusLineHtml(`Match Play: ${pairingRow.MP1_TeamA || '?'} vs ${pairingRow.MP1_TeamB || '?'}`, mp1, pairingRow.MP1_TeamA, pairingRow.MP1_TeamB),
      statusLineHtml(`Match Play: ${pairingRow.MP2_TeamA || '?'} vs ${pairingRow.MP2_TeamB || '?'}`, mp2, pairingRow.MP2_TeamA, pairingRow.MP2_TeamB),
    ].join('');
  } else {
    const cc = computeDay1Segment(currentHoles, 1, 9);
    const asg = computeDay1Segment(currentHoles, 10, 18);
    el.innerHTML = [
      statusLineHtml("Captain's Choice (front 9)", cc, names.A, names.B),
      statusLineHtml('Modified Alternate Shot (back 9)', asg, names.A, names.B),
    ].join('');
  }
}

function statusLineHtml(label, seg, aName, bName) {
  const cls = seg.leader === 'A' ? 'a' : seg.leader === 'B' ? 'b' : seg.leader === 'Half' ? 'half' : 'pending';
  return `<div class="status-line"><strong>${escapeHtml(label)}:</strong> <span class="status-badge ${cls}">${escapeHtml(seg.text)}</span></div>`;
}

// ---- segment computation (shared by scoring page + scoreboard) ----

// Day 1: the scorekeeper records who won each hole directly (row.Winner),
// one combined field applying across all 18 holes — which segment a hole
// belongs to (Captain's Choice front 9 vs Modified Alternate Shot back 9)
// is purely which 9-hole range is being tallied here.
function computeDay1Segment(holeRows, startHole, endHole) {
  let aWins = 0, bWins = 0, decided = 0;
  for (let h = startHole; h <= endHole; h++) {
    const w = (holeRows[h - 1] || {}).Winner;
    if (!w) continue;
    decided++;
    if (w === 'A') aWins++; else if (w === 'B') bWins++;
  }
  const total = endHole - startHole + 1;
  return buildSegmentResult(aWins - bWins, decided, total - decided, total);
}

// `clinched` (only meaningful when final is false) means the segment is
// already mathematically decided — the trailing leader can't be caught even
// if every remaining hole goes the other way — but there are still blank
// holes left to enter. That's the exact moment the Concede-or-continue
// banner offers to stop entering the rest. Once final is true the segment is
// actually finished either way, so clinched is irrelevant there.
function buildSegmentResult(up, decided, remaining, total) {
  if (remaining === 0) {
    if (up > 0) return { leader: 'A', final: true, points: { A: 1, B: 0 }, text: `Final — ${up} up` };
    if (up < 0) return { leader: 'B', final: true, points: { A: 0, B: 1 }, text: `Final — ${Math.abs(up)} up` };
    return { leader: 'Half', final: true, points: { A: 0.5, B: 0.5 }, text: 'Final — Halved' };
  }
  if (decided === 0) return { leader: 'pending', final: false, points: null, text: 'Not started', clinched: false };
  if (up === 0) return { leader: 'pending', final: false, points: null, text: `All Square thru ${decided}`, clinched: false };
  const leader = up > 0 ? 'A' : 'B';
  const clinched = Math.abs(up) > remaining;
  return { leader, final: false, points: null, text: `${Math.abs(up)} up thru ${decided}${clinched ? ' (decided, holes still to enter)' : ''}`, clinched };
}

// Day 2 Best Ball: team-level result per hole, stored directly (row.BestBallWinner).
function computeDay2BestBall(pairingRow, holeRows) {
  let aWins = 0, bWins = 0, decided = 0;
  for (let h = 1; h <= 9; h++) {
    const w = (holeRows[h - 1] || {}).BestBallWinner;
    if (!w) continue;
    decided++;
    if (w === 'A') aWins++; else if (w === 'B') bWins++;
  }
  return buildSegmentResult(aWins - bWins, decided, 9 - decided, 9);
}

// Day 2 Individual Match Play: mpNum is 1 or 2 (row.MP1Winner / row.MP2Winner).
function computeDay2MatchPlay(pairingRow, holeRows, mpNum) {
  const field = 'MP' + mpNum + 'Winner';
  let aWins = 0, bWins = 0, decided = 0;
  for (let h = 10; h <= 18; h++) {
    const w = (holeRows[h - 1] || {})[field];
    if (!w) continue;
    decided++;
    if (w === 'A') aWins++; else if (w === 'B') bWins++;
  }
  return buildSegmentResult(aWins - bWins, decided, 9 - decided, 9);
}

// Given which winner field was just tapped (plus, for Day 1 where one field
// covers both 9s, which hole it was tapped on), returns that field's segment
// result — the one piece shared by the concede/continue transition check and
// the banner itself, so both always look at exactly the same computation.
function segmentResultForField(day, field, holeNum, pairingRow, holeRows) {
  if (day === '2') {
    if (field === 'BestBallWinner') return computeDay2BestBall(pairingRow, holeRows);
    if (field === 'MP1Winner') return computeDay2MatchPlay(pairingRow, holeRows, 1);
    return computeDay2MatchPlay(pairingRow, holeRows, 2);
  }
  return holeNum <= 9 ? computeDay1Segment(holeRows, 1, 9) : computeDay1Segment(holeRows, 10, 18);
}

function playerHandicap(name) {
  const p = rosterByName[name];
  return p ? courseHandicap(p.HandicapIndex, p.Tee) : '';
}
// ====================== SCOREBOARD HOLE-RESULT HELPERS ======================
// Shared by the Scoreboard tab's Leaderboard segment computation and its
// Match Scorecards "Progression" strips.

// Pulls the leading hole number out of a Start Hole value like "18a" or
// "18b" (or a plain "5") so that hole's column can be highlighted.
function startHoleNumberOf(startHole) {
  const m = String(startHole || '').match(/^\s*(\d{1,2})/);
  if (!m) return null;
  const n = parseInt(m[1], 10);
  return (n >= 1 && n <= 18) ? n : null;
}
// ---- per-hole result arrays, shared by the Scoreboard's collapsed
// progression strips. pairingRow is kept in each signature for call-site
// compatibility even though the direct-entry model no longer needs it to
// compute a result. ----
function day1PerHoleResults(holeRows, startHole, endHole) {
  const results = [];
  for (let h = startHole; h <= endHole; h++) {
    results.push(normalizeWinner((holeRows[h - 1] || {}).Winner));
  }
  return results;
}
function day2BestBallPerHoleResults(pairingRow, holeRows) {
  const results = [];
  for (let h = 1; h <= 9; h++) {
    results.push(normalizeWinner((holeRows[h - 1] || {}).BestBallWinner));
  }
  return results;
}
function day2MatchPlayPerHoleResults(pairingRow, holeRows, mpNum) {
  const field = 'MP' + mpNum + 'Winner';
  const results = [];
  for (let h = 10; h <= 18; h++) {
    results.push(normalizeWinner((holeRows[h - 1] || {})[field]));
  }
  return results;
}

// ====================== SCOREBOARD ======================
// Two top-level views ("Leaderboard" and "Match Scorecards"), each reading
// the same sbDay selector — but the day selector's own options differ
// (Leaderboard adds a "Two Day Total" choice that doesn't make sense for
// an 18-hole scorecard), so switching views also rebuilds that dropdown.
let sbView = 'leaderboard';

document.getElementById('sbDay').addEventListener('change', loadScoreboard);

function setSbView(view) {
  sbView = view;
  document.querySelectorAll('#sbViewToggle .view-toggle-btn').forEach((b) => b.classList.toggle('active', b.dataset.sbview === view));
  document.getElementById('sbLeaderboard').hidden = view !== 'leaderboard';
  document.getElementById('sbScorecards').hidden = view !== 'scorecards';
  document.getElementById('sbIndividual').hidden = view !== 'individual';
  // Individual Results always covers the whole two-day tournament at once —
  // no day to pick, so the dropdown is just hidden rather than repurposed.
  document.getElementById('sbDay').hidden = view === 'individual';
  updateSbDayOptions();
  loadScoreboard();
}
function updateSbDayOptions() {
  const sel = document.getElementById('sbDay');
  const current = sel.value;
  const opts = sbView === 'leaderboard'
    ? [['1', 'Day 1'], ['2', 'Day 2'], ['total', 'Two Day Total']]
    : [['1', 'Day 1'], ['2', 'Day 2']];
  sel.innerHTML = opts.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
  sel.value = opts.some(([v]) => v === current) ? current : '1';
}
updateSbDayOptions(); // populate the day dropdown up front, before any data loads

function loadScoreboard() {
  const day = document.getElementById('sbDay').value;
  if (sbView === 'scorecards') return loadScorecardsView(day);
  if (sbView === 'individual') return loadIndividualResults();
  if (day === 'total') return loadTournamentTotal();
  return loadLeaderboardView(day);
}

// Last names of a two-player pairing, joined like the pairing columns
// elsewhere on the leaderboard (e.g. "Stewart + Davis").
function pairName(p1, p2) {
  return `${lastName(p1)} + ${lastName(p2)}`;
}
// Splices the leading side's name into a segment's status text, right before
// the margin — "Final — 2 up" becomes "Final — Stewart + Davis 2 up", "2 up
// thru 5" becomes "Rich 2 up thru 5". Halved/all-square/not-started have no
// one to name, so those pass through unchanged.
function segStatusTextWithName(seg, aName, bName) {
  if (seg.leader !== 'A' && seg.leader !== 'B') return seg.text;
  const leadName = seg.leader === 'A' ? aName : bName;
  return seg.text.replace(/(\d+ up)/, `${leadName} $1`);
}
// The colored pill by itself (e.g. "Stewart + Davis 2 up") — same look as
// the Live Scoring status lines, reused anywhere a segment's current
// leader/margin needs to be named rather than only color-coded: the
// leaderboard's per-segment badges, the Match Scorecards progression rows,
// and the mirrored scorecard on the Live Scoring page.
function segStatusBadgeHtml(seg, aName, bName) {
  const cls = seg.leader === 'A' ? 'a' : seg.leader === 'B' ? 'b' : seg.leader === 'Half' ? 'half' : 'pending';
  const text = segStatusTextWithName(seg, aName, bName);
  // Team A/B badges show that team's own configured color (set in Settings)
  // instead of a fixed green/red — Half (tie) and pending stay their usual
  // neutral colors via the CSS classes alone, since neither belongs to a team.
  const colors = teamColors();
  const style = cls === 'a' ? ` style="background:${escapeHtml(colors.A)};"` : cls === 'b' ? ` style="background:${escapeHtml(colors.B)};"` : '';
  return `<span class="status-badge ${cls}"${style}>${escapeHtml(text)}</span>`;
}
// One compact badge per segment (e.g. "Captain's Choice: Final — Stewart +
// Davis 2 up"), stacked in the leaderboard row's middle "Match" column.
function lbxSegBadgeHtml(label, seg, aName, bName) {
  return `<div class="lbx-seg"><span class="lbx-seg-label">${escapeHtml(label)}:</span> ${segStatusBadgeHtml(seg, aName, bName)}</div>`;
}
// One side's points column as a stack lining up with the segment badges next
// to it — a line per segment (blank dash until that segment is final, so
// "not decided yet" never looks like "0 points"), then a bold total line
// separated by a rule, matching the grand total row at the bottom of the
// table.
function lbxPtsStackHtml(segs, side, total) {
  const segLines = segs.map((s) => `<div class="lbx-pts-seg">${s.final ? formatPts(s.points[side]) : '&ndash;'}</div>`).join('');
  return `${segLines}<div class="lbx-pts-total">${formatPts(total)}</div>`;
}
// Computes segs/segLabels/segNames from an already-built 18-hole grid —
// split out of matchSegmentInfo below so the same computation can run
// directly on the Live Scoring page's own `currentHoles` (see
// scorecardProgRowsHtml's use in renderHoleByHole) without needing a
// separate fetch of saved scores — it reflects taps as they happen, not
// just what's been saved. segNames pairs with segs/segLabels — the [A-side
// name, B-side name] to use when naming who's up.
function segmentInfoFromHoles(day, row, holeRows) {
  let segs, segLabels, segNames;
  if (day === '2') {
    segs = [computeDay2BestBall(row, holeRows), computeDay2MatchPlay(row, holeRows, 1), computeDay2MatchPlay(row, holeRows, 2)];
    segLabels = ['Best Ball', `${lastName(row.MP1_TeamA)} vs ${lastName(row.MP1_TeamB)}`, `${lastName(row.MP2_TeamA)} vs ${lastName(row.MP2_TeamB)}`];
    segNames = [
      [pairName(row.TeamA_P1, row.TeamA_P2), pairName(row.TeamB_P1, row.TeamB_P2)],
      [lastName(row.MP1_TeamA), lastName(row.MP1_TeamB)],
      [lastName(row.MP2_TeamA), lastName(row.MP2_TeamB)],
    ];
  } else {
    segs = [computeDay1Segment(holeRows, 1, 9), computeDay1Segment(holeRows, 10, 18)];
    segLabels = ["Captain's Choice", 'Modified Alternate Shot'];
    const pairA = pairName(row.TeamA_P1, row.TeamA_P2), pairB = pairName(row.TeamB_P1, row.TeamB_P2);
    segNames = [[pairA, pairB], [pairA, pairB]];
  }
  return { segs, segLabels, segNames };
}
// Per-match segment breakdown, shared by the per-day leaderboard and the
// Two Day Total's day-by-day totals — returns each segment's result plus
// that match's points, without touching the DOM.
function matchSegmentInfo(day, row, scoresByMatch) {
  const holeRows = buildHoleGrid(day, row.MatchNum, scoresByMatch[row.MatchNum] || []);
  const { segs, segLabels, segNames } = segmentInfoFromHoles(day, row, holeRows);
  let ptsA = 0, ptsB = 0;
  segs.forEach((s) => { if (s.final) { ptsA += s.points.A; ptsB += s.points.B; } });
  return { holeRows, segs, segLabels, segNames, ptsA, ptsB };
}

async function loadLeaderboardView(day) {
  const res = await apiGet('getScores', { day });
  const scoresByMatch = {};
  if (res.success) res.data.forEach((r) => { (scoresByMatch[r.MatchNum] = scoresByMatch[r.MatchNum] || []).push(r); });

  const names = teamNames();
  let totalA = 0, totalB = 0;
  const rowsHtml = (pairings[day] || []).map((row) => {
    if (!hasPlayersLb(row)) {
      return `<tr><td colspan="5" class="lbx-unset">Match ${escapeHtml(row.MatchNum)} — not set up yet</td></tr>`;
    }
    const { segs, segLabels, segNames, ptsA, ptsB } = matchSegmentInfo(day, row, scoresByMatch);
    totalA += ptsA; totalB += ptsB;
    // Solid highlight, in that team's own color, once every segment in the
    // match is final; a lighter tint of the same color just shows who's
    // currently ahead while the match is still in progress.
    const allFinal = segs.every((s) => s.final);
    const aAhead = ptsA > ptsB, bAhead = ptsB > ptsA;
    const leadClassA = aAhead ? (allFinal ? 'lbx-final-lead-a' : 'lbx-lead-a') : '';
    const leadClassB = bAhead ? (allFinal ? 'lbx-final-lead-b' : 'lbx-lead-b') : '';
    const tiedClass = (!aAhead && !bAhead && allFinal) ? 'lbx-tied' : '';
    const pairA = `${lastName(row.TeamA_P1)} + ${lastName(row.TeamA_P2)}`;
    const pairB = `${lastName(row.TeamB_P1)} + ${lastName(row.TeamB_P2)}`;
    const segBadges = segs.map((s, i) => lbxSegBadgeHtml(segLabels[i], s, segNames[i][0], segNames[i][1])).join('');
    return `<tr>
      <td class="lbx-pts ${leadClassA} ${tiedClass}">${lbxPtsStackHtml(segs, 'A', ptsA)}</td>
      <td class="lbx-pair ${leadClassA} ${tiedClass}"><div class="lbx-names">${escapeHtml(pairA)}</div><div class="lbx-matchnum">Match ${escapeHtml(row.MatchNum)}</div></td>
      <td class="lbx-match">${segBadges}</td>
      <td class="lbx-pair ${leadClassB} ${tiedClass}"><div class="lbx-names">${escapeHtml(pairB)}</div><div class="lbx-matchnum">Match ${escapeHtml(row.MatchNum)}</div></td>
      <td class="lbx-pts ${leadClassB} ${tiedClass}">${lbxPtsStackHtml(segs, 'B', ptsB)}</td>
    </tr>`;
  }).join('');

  document.getElementById('sbLeaderboard').innerHTML = `
    <div class="lbx-wrap">
      <table class="lbx-table">
        <thead>
          <tr class="lbx-head"><th>Points</th><th class="lbx-pair-h">${teamNameHtml(names.A, teamColors().A)}</th><th>Match</th><th class="lbx-pair-h">${teamNameHtml(names.B, teamColors().B)}</th><th>Points</th></tr>
        </thead>
        <tbody>${rowsHtml || `<tr><td colspan="5" class="hint">No matches set up yet.</td></tr>`}</tbody>
        ${rowsHtml ? `<tfoot><tr class="lbx-total"><td>${formatPts(totalA)}</td><td class="lbx-pair-h">${teamNameHtml(names.A, teamColors().A)}</td><td>TOTAL</td><td class="lbx-pair-h">${teamNameHtml(names.B, teamColors().B)}</td><td>${formatPts(totalB)}</td></tr></tfoot>` : ''}
      </table>
    </div>
  `;
}

// Team totals broken out by format, pooling every match on that day together
// (unlike the per-day Leaderboard's one-row-per-match view) — Day 1 splits
// into Captain's Choice / Modified Alternate Shot, Day 2 into Best Ball /
// Individual Match Play (both matchups combined into one figure). Day 1 and
// Day 2 pairings are entered independently (Match 3 on Day 1 isn't
// guaranteed to be the same foursome as Match 3 on Day 2), so a combined
// per-match row isn't meaningful here — only the format-level totals are.
function formatTotals(day, res) {
  const scoresByMatch = {};
  if (res.success) res.data.forEach((r) => { (scoresByMatch[r.MatchNum] = scoresByMatch[r.MatchNum] || []).push(r); });
  const totals = day === '2'
    ? { bestBall: { A: 0, B: 0 }, matchPlay: { A: 0, B: 0 } }
    : { captainsChoice: { A: 0, B: 0 }, altShot: { A: 0, B: 0 } };
  (pairings[day] || []).filter(hasPlayersLb).forEach((row) => {
    const { segs } = matchSegmentInfo(day, row, scoresByMatch);
    if (day === '2') {
      const [bb, mp1, mp2] = segs;
      if (bb.final) { totals.bestBall.A += bb.points.A; totals.bestBall.B += bb.points.B; }
      if (mp1.final) { totals.matchPlay.A += mp1.points.A; totals.matchPlay.B += mp1.points.B; }
      if (mp2.final) { totals.matchPlay.A += mp2.points.A; totals.matchPlay.B += mp2.points.B; }
    } else {
      const [cc, altShot] = segs;
      if (cc.final) { totals.captainsChoice.A += cc.points.A; totals.captainsChoice.B += cc.points.B; }
      if (altShot.final) { totals.altShot.A += altShot.points.A; totals.altShot.B += altShot.points.B; }
    }
  });
  return totals;
}

// Same "Points | Team | Match | Team | Points" table as the per-day
// Leaderboard, but each row is a whole-tournament format total (Captain's
// Choice, Modified Alternate Shot, Best Ball, Individual Match Play)
// instead of one specific match — so the middle "Match" column names the
// format instead of a live status badge, and the pairing columns are blank
// (there's no one pairing to name once results are pooled across matches).
// Per-match/matchup rows behind the "Show match detail" toggle below the
// pooled Two Day Total table — that table pools every match into one number
// per format (Day 1 and Day 2 pairings aren't guaranteed to be the same
// foursome from one day to the next, so a single combined per-match row
// isn't meaningful — see the note on formatTotals above), but people still
// want to see which specific matches are behind that pooled number.
// segIndexes lets Day 2's "Individual Match Play" pull in both the MP1 and
// MP2 matchups as separate rows (each is its own head-to-head, distinct from
// the Best Ball pairing they're part of) while every other format is a
// single segIndex.
function tournamentFormatDetailRows(day, segIndexes, res) {
  const scoresByMatch = {};
  if (res.success) res.data.forEach((r) => { (scoresByMatch[r.MatchNum] = scoresByMatch[r.MatchNum] || []).push(r); });
  const out = [];
  (pairings[day] || []).filter(hasPlayersLb).forEach((row) => {
    const { segs, segNames } = matchSegmentInfo(day, row, scoresByMatch);
    segIndexes.forEach((segIndex) => {
      const seg = segs[segIndex];
      if (!seg) return;
      out.push({ matchNum: row.MatchNum, seg, aName: segNames[segIndex][0], bName: segNames[segIndex][1] });
    });
  });
  return out;
}
function formatDetailTableHtml(label, day, segIndexes, res) {
  const rows = tournamentFormatDetailRows(day, segIndexes, res);
  if (!rows.length) return '';
  const rowsHtml = rows.map(({ matchNum, seg, aName, bName }) => `<tr>
    <td class="lbx-pts">${seg.final ? formatPts(seg.points.A) : '&ndash;'}</td>
    <td class="lbx-pair"><div class="lbx-names">${escapeHtml(aName)}</div><div class="lbx-matchnum">Match ${escapeHtml(matchNum)}</div></td>
    <td class="lbx-match">${segStatusBadgeHtml(seg, aName, bName)}</td>
    <td class="lbx-pair"><div class="lbx-names">${escapeHtml(bName)}</div><div class="lbx-matchnum">Match ${escapeHtml(matchNum)}</div></td>
    <td class="lbx-pts">${seg.final ? formatPts(seg.points.B) : '&ndash;'}</td>
  </tr>`).join('');
  return `
    <div class="lbx-detail-section">
      <div class="hbh-seglabel">${escapeHtml(label)} &mdash; Day ${escapeHtml(day)}</div>
      <div class="lbx-wrap">
        <table class="lbx-table"><tbody>${rowsHtml}</tbody></table>
      </div>
    </div>`;
}
function toggleTdtDetail() {
  const el = document.getElementById('tdtDetail');
  const btn = document.getElementById('tdtToggleBtn');
  if (!el || !btn) return;
  el.hidden = !el.hidden;
  btn.innerHTML = el.hidden ? 'Show match detail &#9662;' : 'Hide match detail &#9652;';
}
async function loadTournamentTotal() {
  const [res1, res2] = await Promise.all([apiGet('getScores', { day: '1' }), apiGet('getScores', { day: '2' })]);
  const d1 = formatTotals('1', res1), d2 = formatTotals('2', res2);
  const names = teamNames();
  const formatRows = [
    ["Captain's Choice", d1.captainsChoice, '1', [0], res1],

    ['Individual Match Play', d2.matchPlay, '2', [1, 2], res2],
  ];
  const grandA = formatRows.reduce((sum, [, pts]) => sum + pts.A, 0);
  const grandB = formatRows.reduce((sum, [, pts]) => sum + pts.B, 0);
  const rowsHtml = formatRows.map(([label, pts]) => {
    const aAhead = pts.A > pts.B, bAhead = pts.B > pts.A;
    return `<tr>
      <td class="lbx-pts ${aAhead ? 'lbx-lead-a' : ''}"><span class="lbx-pts-total" style="border-top:none; margin-top:0; padding-top:0;">${formatPts(pts.A)}</span></td>
      <td class="lbx-pair"></td>
      <td class="lbx-match" style="text-align:center; font-weight:600;">${escapeHtml(label)}</td>
      <td class="lbx-pair"></td>
      <td class="lbx-pts ${bAhead ? 'lbx-lead-b' : ''}"><span class="lbx-pts-total" style="border-top:none; margin-top:0; padding-top:0;">${formatPts(pts.B)}</span></td>
    </tr>`;

  document.getElementById('sbLeaderboard').innerHTML = `

        </thead>

        <tfoot><tr class="lbx-total"><td>${formatPts(grandA)}</td><td class="lbx-pair-h">${teamNameHtml(names.A, teamColors().A)}</td><td>TOTAL</td><td class="lbx-pair-h">${teamNameHtml(names.B, teamColors().B)}</td><td>${formatPts(grandB)}</td></tr></tfoot>
      </table>

// ---- Individual Results: each player's own point total, by format ----

// Every player's points for one day, credited from whichever match they
// actually took part in — Day 1's Captain's Choice/Modified Alternate Shot
// are a shared team-of-two result, so both teammates get the same figure;
// Day 2's Best Ball is likewise shared by both teammates, but Individual
// Match Play is genuinely per-player (MP1_TeamA/MP1_TeamB, MP2_TeamA/
// MP2_TeamB name exactly which two players faced off). A segment that
// isn't final yet simply doesn't add anything, same as the Leaderboard.
function individualPointsFor(day, res) {
  const scoresByMatch = {};
  if (res.success) res.data.forEach((r) => { (scoresByMatch[r.MatchNum] = scoresByMatch[r.MatchNum] || []).push(r); });
  const pts = {}; // name -> { cc, altShot, bestBall, matchPlay }
  const add = (name, field, value) => {
    if (!name) return;
    if (!pts[name]) pts[name] = { cc: 0, altShot: 0, bestBall: 0, matchPlay: 0 };
    pts[name][field] += value;
  };
  (pairings[day] || []).filter(hasPlayersLb).forEach((row) => {
    const holeRows = buildHoleGrid(day, row.MatchNum, scoresByMatch[row.MatchNum] || []);
    if (day === '2') {
      const bb = computeDay2BestBall(row, holeRows);
      const mp1 = computeDay2MatchPlay(row, holeRows, 1);
      const mp2 = computeDay2MatchPlay(row, holeRows, 2);
      if (bb.final) {
        add(row.TeamA_P1, 'bestBall', bb.points.A); add(row.TeamA_P2, 'bestBall', bb.points.A);
        add(row.TeamB_P1, 'bestBall', bb.points.B); add(row.TeamB_P2, 'bestBall', bb.points.B);
      }
      if (mp1.final) { add(row.MP1_TeamA, 'matchPlay', mp1.points.A); add(row.MP1_TeamB, 'matchPlay', mp1.points.B); }
      if (mp2.final) { add(row.MP2_TeamA, 'matchPlay', mp2.points.A); add(row.MP2_TeamB, 'matchPlay', mp2.points.B); }
    } else {
      const cc = computeDay1Segment(holeRows, 1, 9);
      const altShot = computeDay1Segment(holeRows, 10, 18);
      if (cc.final) {
        add(row.TeamA_P1, 'cc', cc.points.A); add(row.TeamA_P2, 'cc', cc.points.A);
        add(row.TeamB_P1, 'cc', cc.points.B); add(row.TeamB_P2, 'cc', cc.points.B);
      }
      if (altShot.final) {
        add(row.TeamA_P1, 'altShot', altShot.points.A); add(row.TeamA_P2, 'altShot', altShot.points.A);
        add(row.TeamB_P1, 'altShot', altShot.points.B); add(row.TeamB_P2, 'altShot', altShot.points.B);
      }
    }
  });
  return pts;
}

// Points of exactly 0 print as a dash rather than "0", same convention as
// the reference template — a scorekeeper reads a dash as "shut out on this
// one," not as missing data.
function indivCellHtml(n) {
  return n > 0 ? formatPts(n) : '&ndash;';
}

function individualTableHtml(teamLabel, teamColor, players, pts) {
  const color = escapeHtml(teamColor || '#999999');
  const blank = { cc: 0, altShot: 0, bestBall: 0, matchPlay: 0 };
  const rowsHtml = players.map((name) => {
    const p = pts[name] || blank;
    const total = p.cc + p.altShot + p.bestBall + p.matchPlay;
    return `<tr><td class="indiv-name">${escapeHtml(name)}</td><td>${indivCellHtml(p.cc)}</td><td>${indivCellHtml(p.altShot)}</td><td>${indivCellHtml(p.bestBall)}</td><td>${indivCellHtml(p.matchPlay)}</td><td class="indiv-total">${indivCellHtml(total)}</td></tr>`;
  }).join('');
  const totals = players.reduce((acc, name) => {
    const p = pts[name] || blank;
    acc.cc += p.cc; acc.altShot += p.altShot; acc.bestBall += p.bestBall; acc.matchPlay += p.matchPlay;
    return acc;
  }, { cc: 0, altShot: 0, bestBall: 0, matchPlay: 0 });
  const grandTotal = totals.cc + totals.altShot + totals.bestBall + totals.matchPlay;
  return `
    <div class="indiv-table-wrap">
      <table class="indiv-table">
        <thead>
          <tr class="indiv-team-row" style="background:${color};"><th colspan="6">${teamNameHtml(teamLabel, teamColor)}</th></tr>
          <tr class="indiv-daygroup-row"><th></th><th colspan="2">Day 1</th><th colspan="2">Day 2</th><th></th></tr>
          <tr class="indiv-col-row"><th></th><th>Captain's Choice</th><th>Alternate Shot</th><th>Best Ball</th><th>Match Play</th><th>Total</th></tr>
        </thead>
        <tbody>${rowsHtml || `<tr><td colspan="6" class="lbx-unset">No players assigned to this team yet (Admin &rarr; Roster)</td></tr>`}</tbody>
        ${players.length ? `<tfoot><tr class="indiv-total-row" style="background:${color};"><td>Total</td><td>${formatPts(totals.cc)}</td><td>${formatPts(totals.altShot)}</td><td>${formatPts(totals.bestBall)}</td><td>${formatPts(totals.matchPlay)}</td><td>${formatPts(grandTotal)}</td></tr></tfoot>` : ''}
      </table>
    </div>
  `;
}

async function loadIndividualResults() {
  const [res1, res2] = await Promise.all([apiGet('getScores', { day: '1' }), apiGet('getScores', { day: '2' })]);
  const pts1 = individualPointsFor('1', res1), pts2 = individualPointsFor('2', res2);
  const pts = {};
  new Set([...Object.keys(pts1), ...Object.keys(pts2)]).forEach((name) => {
    pts[name] = {
      cc: (pts1[name] || {}).cc || 0,
      altShot: (pts1[name] || {}).altShot || 0,
      bestBall: (pts2[name] || {}).bestBall || 0,
      matchPlay: (pts2[name] || {}).matchPlay || 0,
    };
  });
  const names = teamNames();
  const colors = teamColors();
  // Grouped by each player's Roster team assignment (Admin → Roster), not by
  // who they happened to be paired with in any one match.
  const teamAPlayers = roster.filter((p) => p.Team === 'A' && p.Name).map((p) => p.Name);
  const teamBPlayers = roster.filter((p) => p.Team === 'B' && p.Name).map((p) => p.Name);
  document.getElementById('sbIndividual').innerHTML = `
    <div class="indiv-wrap">
      ${individualTableHtml(names.A, colors.A, teamAPlayers, pts)}
      ${individualTableHtml(names.B, colors.B, teamBPlayers, pts)}
    </div>
  `;
}

// ---- Match Scorecards: "Progression" strips, one per format segment ----

// A per-hole strip showing the running match-play margin as holes come in —
// cumulative net of wins (+1 for A, -1 for B) over whatever's decided so far,
// left to right. A hole before anything's been decided yet shows as blank
// rather than "AS", so "not started" and "all square" don't look the same.
function progressionStripHtml(results, activeStart) {
  const colors = teamColors();
  let cum = 0;
  let cells = '';
  for (let i = 0; i < results.length; i++) {
    const r = results[i];
    const hole = activeStart + i;
    // A hole with no result entered yet always reads as "not entered" — even
    // if an earlier hole in this segment was already decided — rather than
    // silently carrying forward the running margin from the last decided
    // hole, which used to make an un-entered hole look identical to a
    // decided one.
    if (r === 'pending') {
      cells += `<div class="prog-chip prog-pending" title="Hole ${hole} — not entered"><div class="prog-hole">${hole}</div><div class="prog-label">&ndash;</div></div>`;
      continue;
    }
    if (r === 'A') cum += 1;
    else if (r === 'B') cum -= 1;
    // 'Half' and 'Conceded' both leave cum unchanged — a conceded hole never
    // happened, so it can't move the margin either.
    let label, cls;
    if (cum === 0) { label = 'AS'; cls = 'half'; }
    else { label = `${Math.abs(cum)} up`; cls = cum > 0 ? 'a' : 'b'; }
    // A halved hole doesn't move the running margin, so on its own it can
    // look identical to the hole before it (e.g. "1 up" -> "1 up"). Flag it
    // explicitly with a small tie mark so a tie is never invisible. A
    // conceded hole gets its own distinct badge for the same reason — it
    // also leaves the margin unchanged, but isn't a tie.
    const tieMark = r === 'Half' ? '<div class="prog-tie" title="Tied this hole">T</div>' : '';
    const concededMark = r === 'Conceded' ? '<div class="prog-conceded" title="Conceded">C</div>' : '';
    const titleSuffix = r === 'Half' ? ' — tied' : r === 'Conceded' ? ' — conceded' : '';
    // Same team-color treatment as segStatusBadgeHtml — 'a'/'b' chips get
    // that team's own color, 'half' keeps its neutral tie color as-is.
    const style = cls === 'a' ? ` style="background:${escapeHtml(colors.A)};"` : cls === 'b' ? ` style="background:${escapeHtml(colors.B)};"` : '';
    cells += `<div class="prog-chip prog-${cls}"${style} title="Hole ${hole}${titleSuffix}"><div class="prog-hole">${hole}</div><div class="prog-label">${label}</div>${tieMark}${concededMark}</div>`;
  }
  return cells;
}

// Shared by the Scoreboard's "All Match Scorecards" and the mirrored
// per-match scorecard on the Live Scoring page — one strip per format
// segment, each headed by its label plus a colored, named status badge
// (e.g. "Kusilek 2 up") so who's up is never color-only.
function scorecardRowsDef(day, row, holeRows, segs, segNames) {
  return day === '2'
    ? [
        ['Best Ball (front 9)', day2BestBallPerHoleResults(row, holeRows), 1, segs[0], segNames[0]],
        [`Match Play: ${row.MP1_TeamA || '?'} vs ${row.MP1_TeamB || '?'}`, day2MatchPlayPerHoleResults(row, holeRows, 1), 10, segs[1], segNames[1]],
        [`Match Play: ${row.MP2_TeamA || '?'} vs ${row.MP2_TeamB || '?'}`, day2MatchPlayPerHoleResults(row, holeRows, 2), 10, segs[2], segNames[2]],
      ]
    : [
        ["Captain's Choice (front 9)", day1PerHoleResults(holeRows, 1, 9), 1, segs[0], segNames[0]],
        ['Modified Alt Shot (back 9)', day1PerHoleResults(holeRows, 10, 18), 10, segs[1], segNames[1]],
      ];
}
function scorecardProgRowsHtml(day, row, holeRows, segs, segNames) {
  return scorecardRowsDef(day, row, holeRows, segs, segNames).map(([label, results, start, seg, names]) => `
    <div class="prog-row">
      <div class="prog-row-head">
        <div class="prog-seg-label">${escapeHtml(label)}</div>
        ${segStatusBadgeHtml(seg, names[0], names[1])}
      </div>
      <div class="prog-strip">${progressionStripHtml(results, start)}</div>
    </div>
  `).join('');
}
function scorecardsCollapsedHtml(day, row, scoresByMatch) {
  const { holeRows, segs, segNames } = matchSegmentInfo(day, row, scoresByMatch);
  const progRows = scorecardProgRowsHtml(day, row, holeRows, segs, segNames);
  return `<div class="sc-collapsed-match"><div class="match-title">${escapeHtml(matchLabel(day, row))}</div>${progRows}</div>`;
}

async function loadScorecardsView(day) {
  const res = await apiGet('getScores', { day });
  const scoresByMatch = {};
  if (res.success) res.data.forEach((r) => { (scoresByMatch[r.MatchNum] = scoresByMatch[r.MatchNum] || []).push(r); });

  const rows = pairings[day] || [];
  let html;
  if (!rows.length) {
    html = '<p class="hint">No matches set up yet.</p>';
  } else {
    html = rows.map((row) => hasPlayersLb(row)
      ? scorecardsCollapsedHtml(day, row, scoresByMatch)
      : `<div class="sc-collapsed-match"><div class="lbx-unset">Match ${escapeHtml(row.MatchNum)} — not set up yet</div></div>`
    ).join('');
  }
  document.getElementById('sbScorecardsBody').innerHTML = html;
}

// ====================== UTIL ======================
function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ====================== ENTRY GATE ======================
// See the #entryGate markup near the top of <body>. Kicked off in parallel
// with loadShared() below (sharedDataPromise) so the "Scorekeeper or
// Viewing?" question shows up instantly, without waiting on the network —
// only the PIN lookup itself needs to wait for pairings data to arrive.
function hideEntryGate() {
  const el = document.getElementById('entryGate');
  if (el) el.remove();
}
function chooseViewer() {
  hideEntryGate();
  document.querySelector('.tab-btn[data-tab="scoreboard"]').click();
}
function chooseScorekeeper() {
  document.getElementById('entryGateChoice').hidden = true;
  document.getElementById('entryGatePin').hidden = false;
  document.getElementById('gatePinInput').focus();
}
// A match's Scorekeeper PIN is one value per match number, shared by both
// days, so this just looks up which match number (if any) has this PIN.
function findMatchNumByPin(pin) {
  const row = matchPins.find((r) => {
    const requiredPin = String(r.PIN || '').trim();
    return requiredPin && pinsMatch(pin, requiredPin);
  });
  return row ? String(row.MatchNum) : null;
}
// Which day a PIN entry should land on: Day 1 up until Day 2's own date
// (from Settings), Day 2 from that date on — so a Day-2 scorekeeper typing
// their PIN on the morning of Day 2 doesn't have to manually switch off of
// Day 1 first before they can enter anything. Falls back to Day 1 if
// Day2Date isn't set (or isn't a valid date) yet.
function defaultGateDay_() {
  const day2Date = settings && settings.Day2Date ? new Date(settings.Day2Date + 'T00:00:00') : null;
  if (!day2Date || isNaN(day2Date.getTime())) return '1';
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return today >= day2Date ? '2' : '1';
}
async function submitGatePin() {
  const input = document.getElementById('gatePinInput');
  const entered = input.value.trim();
  const errEl = document.getElementById('gatePinError');
  if (!entered) { errEl.textContent = 'Enter your PIN, or tap "I don\'t have a PIN" below.'; return; }
  errEl.textContent = 'Checking…';
  input.disabled = true;
  // If cache or the embedded snapshot already gave us real data to check
  // against (bootDataReady), don't make someone wait on a network round
  // trip just to check a PIN — that's exactly the wait that was causing
  // logins to fail outright under real tournament-day load. The live fetch
  // is already running in the background (kicked off at page load) and will
  // quietly take over moments later if anything's actually different (a
  // corrected PIN, a last-minute lineup swap). Only when neither cache nor
  // snapshot exists yet — this phone's genuine first-ever load, with no
  // snapshot baked into the file either — does a PIN check have to wait.
  if (!bootDataReady) {
    try {
      await ensureSharedData(); // pairings/matchPins (and AdminPIN, via settings) may still be loading
    } catch (e) {
      input.disabled = false;
      errEl.textContent = 'Could not reach the tournament server — check your connection and try again.';
      return;
    }
  }
  input.disabled = false;
  const adminPin = String((settings && settings.AdminPIN) || '').trim();
  if (adminPin && entered === adminPin) {
    // The Admin PIN unlocks every match on this device — there's no single
    // match to route to, so just drop into Live Scoring's normal day/match
    // dropdowns, everything already unlocked, defaulted to today's day (see
    // defaultGateDay_).
    setAdminUnlocked(true);
    document.getElementById('scDay').value = defaultGateDay_();
    onScDayOrMatchChange();
    hideEntryGate();
    return;
  }
  const matchNum = findMatchNumByPin(entered);
  if (!matchNum) {
    errEl.textContent = 'PIN not recognized — check with your foursome or the admin.';
    return;
  }
  // One shared PIN covers this match number on both Day 1 and Day 2 — store
  // it once, then land on today's day (Day 1 before Day 2's date, Day 2 from
  // then on — see defaultGateDay_) with this match already selected.
  storePin(matchNum, entered);
  document.getElementById('scDay').value = defaultGateDay_();
  populateMatchDropdown();
  document.getElementById('scMatch').value = matchNum;
  await onScMatchSelected();
  hideEntryGate();
}
document.getElementById('gatePinInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitGatePin(); });

// ====================== BOOT ======================
// Paint instantly from whatever settings/roster/pairings/PINs are already
// available, while the real fetch below runs in the background — avoids a
// blank/unusable Day-Match picker (and a PIN check with nothing to check
// against) on a slow connection. Two possible sources, checked in this
// order: this device's own last-known-good cache (from a previous
// successful load — necessarily the most recent of the two, since it's only
// ever written right after a real fetch succeeds), or, if this device has
// never loaded successfully before, the EMBEDDED_SNAPSHOT baked into this
// file. Deliberately excludes match scores either way: those always come
// from the live fetch in onScMatchSelected below, never from cache/snapshot,
// since showing a stale score would be actively worse than a brief wait for
// the real one.
const cachedShared = loadCachedShared_();
const bootSeed = cachedShared || (EMBEDDED_SNAPSHOT && Object.keys(EMBEDDED_SNAPSHOT).length ? EMBEDDED_SNAPSHOT : null);
// Wrapped defensively: this runs synchronously at the top of the page's own
// script, so an exception here (a hand-edited or malformed paste into
// EMBEDDED_SNAPSHOT, say) would otherwise abort every statement after it in
// this file, including kicking off the real fetch below — the one thing
// that can still recover from a bad snapshot.
if (bootSeed) { try { applySharedSnapshot_(bootSeed); } catch (e) { console.error('Could not apply boot seed', e); } }

// True once settings/roster/pairings/matchPins reflect SOME real data —
// cache or the embedded snapshot at boot, or (once it resolves) the live
// fetch below. submitGatePin uses this to decide whether a PIN check can be
// answered immediately against whatever's already loaded, instead of making
// someone wait on a network round trip — see there for why that matters.
let bootDataReady = !!bootSeed;

// Started immediately (not inside boot() below) so the entry gate's PIN
// lookup can await this same promise without waiting on loadVersionBadge or
// the initial default-match render, neither of which it needs.
//
// apiGet already retries each of the 7 calls loadShared() fires off, so this
// only turns up empty on a real outage — but a promise that already
// rejected stays rejected forever, and both boot() and the entry gate
// (submitGatePin below) need to await this more than once over the page's
// life. ensureSharedData() is what they actually await: it re-runs the
// whole batch one more time on a first failure (a phone that briefly lost
// signal at the exact wrong moment shouldn't need a manual page reload),
// and only then leaves the rejection for its caller to show/handle.
let sharedDataPromise = loadShared();
sharedDataPromise.then(() => { bootDataReady = true; }, () => {});
async function ensureSharedData() {
  try {
    await sharedDataPromise;
  } catch (e) {
    sharedDataPromise = loadShared();
    await sharedDataPromise;
  }
  bootDataReady = true;
}
(async function boot() {
  loadVersionBadge();
  if (bootSeed) populateMatchDropdown(); // instant paint of the Day/Match picker from cache or the embedded snapshot
  try {
    await ensureSharedData();
  } catch (e) {
    // Real outage: leave whatever was painted from cache/snapshot (if any)
    // on screen rather than throwing away a usable-if-stale page. If there
    // was neither (a phone's first-ever load with no snapshot baked in
    // either), the Day/Match picker just stays empty — submitGatePin's own
    // catch below is what tells the person what's wrong when they try to
    // continue.
    console.error('Could not load tournament data', e);
    return;
  }
  populateMatchDropdown(); // re-run against the real data — always wins over whatever was painted first
  await onScMatchSelected();
})();
</script>
