<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heritage Legends Tournament — Live</title>
<style>
  :root {
    --green: #1e5b3a; --green-dark: #123c26; --gold: #c9a227;
    --bg: #f5f5f0; --card: #ffffff; --border: #d8d8d0;
    --text: #222; --muted: #777; --error: #b3261e; --ok: #1e5b3a;
    --win: #e6f4ea; --lose: #fdecea;
    /* Tie/Halve color — a clear yellow. It used to be a very pale cream
       (#f5f0e0), which read as almost the same shade as an unscored hole's
       plain grey (#eee) at a glance, especially in bright outdoor light —
       Tom flagged this after the first real match-day test. Feeds every tied
       indicator in the app (the 18-hole progress strip, the Halve pick
       button, the tie badge on scorecards, the "halved" status badge), not
       just the one Tom noticed, since they're all the same "this hole/match
       is tied" signal and should look the same. */
    --half: #ffd400;
    /* Overwritten from Settings once loaded (see applyTeamColorVars) — these
       defaults just match teamColors()'s own JS fallback, for the instant
       before that runs. */
    --team-a-color: #ADD8E6; --team-b-color: #F08080;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--green); color: #fff; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  header h1 { margin: 0; font-size: 1.2rem; }
  header .sub { font-size: 0.85rem; opacity: 0.85; }
  nav { display: flex; gap: 4px; padding: 0 20px; background: var(--green-dark); flex-wrap: wrap; }
  nav button { background: transparent; border: none; color: #fff; opacity: 0.75; padding: 12px 16px; cursor: pointer; font-size: 0.95rem; border-bottom: 3px solid transparent; }
  nav button.active { opacity: 1; border-bottom-color: var(--gold); font-weight: 600; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 18px; }
  .card h2 { margin-top: 0; font-size: 1.05rem; color: var(--green-dark); }
  select, input[type=number] { padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .status-line { font-size: 0.9rem; margin: 4px 0; }
  .status-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
  .status-badge.a { background: var(--win); color: #222; }
  .status-badge.b { background: var(--lose); color: #222; }
  .status-badge.half { background: var(--half); color: #7a5b00; }
  .status-badge.pending { background: #eee; color: var(--muted); }
  .save-indicator { font-size: 0.85rem; margin-left: 12px; }
  .save-indicator.saving { color: var(--muted); }
  .save-indicator.saved { color: var(--ok); }
  .save-indicator.error { color: var(--error); }
  .hint { font-size: 0.8rem; color: var(--muted); }
  .sc-intro-label { font-weight: 700; color: var(--green-dark); font-size: 0.95rem; margin: 10px 0 4px; width: 100%; }
  /* The actual hole number/letter in "Your match is starting on Hole 14a" —
     boxed and enlarged so it's the one thing that jumps out of that line,
     since it's the answer to "which hole do I go stand on." */
  .start-hole-badge { display: inline-block; font-size: 1.3rem; font-weight: 800; color: var(--green-dark); background: #e8f2ec; border: 1.5px solid var(--green); border-radius: 8px; padding: 2px 12px; margin-left: 4px; vertical-align: middle; }
  [hidden] { display: none !important; }
  button.primary { background: var(--green); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.88rem; font-weight: 600; }
  button.secondary { background: #fff; color: var(--green); border: 1px solid var(--green); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
  .view-toggle-btn { background: #fff; border: 1.5px solid var(--border); color: var(--green-dark); padding: 7px 16px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
  .view-toggle-btn.active { background: var(--green); color: #fff; border-color: var(--green); }
  .hbh-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
  .hbh-nav select { flex: 1; }
  .hbh-nav button { padding: 10px 16px; font-size: 1.1rem; line-height: 1; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; flex-shrink: 0; }
  .hbh-nav button:disabled { opacity: 0.35; }
  /* Rides on the same .wpick-row line as the win/tie/win buttons, as the
     4th button — styled green so it stands out as the "commit" action. */
  .hbh-save-next { flex: 1 1 140px; padding: 14px 6px; font-size: 0.9rem; font-weight: 700; line-height: 1.2; white-space: normal; border-radius: 8px; background: var(--green); color: #fff; border: none; cursor: pointer; }
  /* Day 2 Individual Match Play (back 9) only: two matchup blocks (MP1, MP2)
     render identically — neither's own button row carries the save button —
     so both matchups look the same; this wraps the save button on its own
     centered line below the second matchup instead. .hbh-save-next still
     applies its usual styling, just not stretched to fill the row here. */
  .hbh-save-standalone { display: flex; justify-content: center; margin-top: 12px; }
  .hbh-save-standalone .hbh-save-next { flex: 0 1 auto; max-width: 320px; min-width: 220px; }
  .hbh-seglabel { text-align: center; font-weight: 800; color: var(--green-dark); font-size: 1.08rem; margin: 6px 0 12px; padding: 8px 10px; background: #e8f2ec; border: 1px solid #cfe3d7; border-radius: 8px; }
  /* 18-hole completion map above the pick buttons — click any dot to jump
     there. A hole with no result yet is grey; once a winner (or Tie) is
     picked, the dot's background switches to that team's color (or the tie
     color) via an inline style set in JS — .hbh-progress-decided just sets
     the text/border treatment on top of whatever color was applied inline.
     Save status (entered-but-unconfirmed vs. confirmed-saved) is still shown,
     via a dashed vs. solid border, since that's independent of who won. */
  .hbh-progress-strip { display: flex; flex-wrap: wrap; gap: 3px; margin: 6px 0 10px; justify-content: center; }
  .hbh-progress-dot { width: 22px; height: 22px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 0.68rem; font-weight: 700; cursor: pointer; border: 1.5px solid transparent; transition: width 0.12s, height 0.12s, font-size 0.12s; }
  .hbh-progress-empty { background: #eee; color: var(--muted); }
  .hbh-progress-unsaved { background: #fff3cd; color: #8a6300; border-color: #f0d580; }
  .hbh-progress-saved { background: var(--win); color: var(--green-dark); }
  .hbh-progress-decided { color: #222; text-shadow: 0 1px 1px rgba(255,255,255,0.55); }
  .hbh-progress-decided.hbh-progress-unsaved { border: 2px dashed #8a6300; }
  .hbh-progress-decided.hbh-progress-saved { border: 1.5px solid rgba(0,0,0,0.25); }
  /* Bigger, not just outlined, so the hole currently being entered pops out
     of the row instead of just having a highlighted edge. */
  .hbh-progress-current { width: 32px; height: 32px; font-size: 0.85rem; border-color: var(--green-dark); border-width: 2.5px; box-shadow: 0 0 0 2px var(--green-dark); z-index: 1; }
  /* This match's own scorecard, mirrored onto the entry screen below the
     pick buttons — same progression-strip look as Scoreboard → All Match
     Scorecards. */
  .hbh-mirror-scorecard { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
  .hbh-mirror-title { font-weight: 600; color: var(--green-dark); margin-bottom: 6px; font-size: 0.95rem; }
  .hbh-stroke-note { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
  .hbh-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); margin-left: 4px; }

  /* ---- Leaderboard (Scoreboard tab) — modeled on a printed match-play
     leaderboard: Points | pairing | Match | pairing | Points, winning side
     highlighted, with each match's segment statuses stacked in the middle
     column. ---- */
  .lbx-wrap { overflow-x: auto; }
  table.lbx-table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
  table.lbx-table th, table.lbx-table td { padding: 8px 10px; text-align: center; vertical-align: top; border-bottom: 1px solid var(--border); }
  tr.lbx-head th { background: var(--green-dark); color: #fff; font-weight: 700; border-bottom: none; }
  tr.lbx-head th.lbx-pair-h { text-align: left; }
  td.lbx-pair-h, td.lbx-pair { text-align: left; }
  td.lbx-pts { width: 60px; vertical-align: top; font-variant-numeric: tabular-nums; }
  .lbx-pts-seg { font-size: 0.78rem; font-weight: 400; margin: 2px 0; color: var(--muted); }
  .lbx-pts-total { font-weight: 700; font-size: 1rem; margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--border); }
  td.lbx-final-lead-a .lbx-pts-seg, td.lbx-final-lead-b .lbx-pts-seg { color: rgba(0, 0, 0, 0.6); }
  td.lbx-final-lead-a .lbx-pts-total, td.lbx-final-lead-b .lbx-pts-total { border-top-color: rgba(0, 0, 0, 0.25); }
  .lbx-names { font-weight: 600; color: var(--green-dark); }
  .lbx-matchnum { font-size: 0.72rem; color: var(--muted); }
  .lbx-match { min-width: 200px; }
  .lbx-seg { font-size: 0.78rem; margin: 2px 0; text-align: left; }
  .lbx-seg-label { color: var(--muted); }
  .lbx-unset { text-align: center; color: var(--muted); font-style: italic; padding: 10px; }
  /* Who's leading (or has won) a match is shown in THAT team's own color —
     --team-a-color/--team-b-color are set from Settings once at load (see
     applyTeamColorVars) — a light tint while still in progress, a solid
     fill once the match is final. Not a fixed red/green for either side. */
  td.lbx-lead-a { background: color-mix(in srgb, var(--team-a-color) 35%, white); }
  td.lbx-lead-b { background: color-mix(in srgb, var(--team-b-color) 35%, white); }
  td.lbx-final-lead-a { background: var(--team-a-color); color: #222; }
  td.lbx-final-lead-b { background: var(--team-b-color); color: #222; }
  td.lbx-final-lead-a .lbx-names, td.lbx-final-lead-b .lbx-names { color: #222; }
  td.lbx-tied { background: #eee; }
  tr.lbx-total td { font-weight: 700; background: var(--green-dark); color: #fff; border-bottom: none; }
  tr.lbx-total td.lbx-pair-h { text-align: left; }
  /* Two Day Total's per-format detail, tucked behind a single toggle below
     the pooled-total table — see toggleTdtDetail/formatDetailTableHtml. */
  .lbx-detail-toggle-row { text-align: center; margin: 14px 0 4px; }
  .lbx-detail-section { margin-top: 14px; }
  .lbx-detail-section:first-child { margin-top: 0; }

  /* ---- Individual Results: one table per team, one row per player ---- */
  .indiv-wrap { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  .indiv-table-wrap { flex: 1 1 360px; min-width: 320px; overflow-x: auto; }
  table.indiv-table { border-collapse: collapse; width: 100%; font-size: 0.82rem; }
  table.indiv-table th, table.indiv-table td { padding: 6px 8px; text-align: center; border-bottom: 1px solid var(--border); }
  td.indiv-name { text-align: left; font-weight: 600; }
  td.indiv-total, tr.indiv-col-row th:last-child { font-weight: 700; }
  /* Background is set inline per table (see individualTableHtml) to that
     team's own configured color, not a fixed color shared by both teams. */
  tr.indiv-team-row th { color: #222; font-size: 1rem; text-align: left; padding: 8px 10px; border-bottom: none; }
  tr.indiv-daygroup-row th { background: #eef4ee; color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.02em; border-bottom: none; }
  tr.indiv-total-row td { font-weight: 700; color: #222; border-bottom: none; }
  tr.indiv-total-row td:first-child { text-align: left; }

  /* ---- Match Scorecards: Progression (collapsed) ---- */
  .sc-collapsed-match { border-bottom: 1px solid var(--border); padding: 12px 0; }
  .sc-collapsed-match:last-child { border-bottom: none; }
  .match-title { font-weight: 600; color: var(--green-dark); margin-bottom: 4px; }
  .prog-row { margin: 10px 0; }
  .prog-row-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
  .prog-seg-label { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
  .prog-strip { display: flex; gap: 3px; overflow-x: auto; }
  .prog-chip { position: relative; flex-shrink: 0; width: 40px; text-align: center; border-radius: 6px; padding: 3px 2px; font-size: 0.72rem; }
  .prog-chip.prog-a { background: var(--win); color: #222; }
  .prog-chip.prog-b { background: var(--lose); color: #222; }
  .prog-chip.prog-half { background: var(--half); color: #7a5b00; }
  .prog-chip.prog-pending { background: #eee; color: var(--muted); }
  .prog-hole { font-size: 0.62rem; opacity: 0.7; }
  .prog-label { font-weight: 700; }
  /* Small badge marking a hole that was specifically tied — needed because a
     halved hole doesn't move the cumulative margin shown by .prog-label, so
     without this a tie can look identical to the hole before it. */
  .prog-tie { position: absolute; top: -6px; right: -4px; width: 15px; height: 15px; border-radius: 50%; background: var(--half); color: #7a5b00; border: 1.5px solid #fff; font-size: 0.6rem; font-weight: 800; line-height: 12px; }

  /* ---- Direct hole-winner entry (replaces old gross-score inputs) ---- */
  .wpick-block { padding: 14px 4px; border-bottom: 1px solid var(--border); }
  .wpick-block:last-of-type { border-bottom: none; }
  .wpick-sides { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .wpick-side { font-weight: 600; flex: 1; }
  .wpick-row { display: flex; gap: 8px; flex-wrap: wrap; }
  /* Team (A/B) pick buttons always show their team's own color as their
     background (set inline per-button, since the color is per-tournament —
     see winnerButtonsHtml), not just when picked, so the two sides are easy
     to tell apart at a glance even before tapping anything. A picked button
     is marked instead with a bold dark border plus a leading checkmark in
     its own label text — a color change alone wouldn't show, since the
     color's already there either way. */
  .wpick-btn { flex: 1 1 90px; padding: 14px 6px; font-size: 1rem; font-weight: 700; border-radius: 8px; border: 1.5px solid var(--border); background: #fff; cursor: pointer; }
  .wpick-btn.active { border: 3px solid #1a1a1a; }
  .wpick-btn.active.wpick-half { background: var(--half); border-color: var(--gold); color: #7a5b00; }

  /* ---- Concede-or-continue banner — shown the moment a segment becomes
     mathematically decided with holes still left to play. ---- */
  .concede-banner { background: #fff7e0; border: 1.5px solid var(--gold); border-radius: 10px; padding: 12px 14px; margin: 10px 0 14px; }
  .concede-banner-title { font-weight: 700; color: #7a5b00; margin-bottom: 4px; }
  .concede-banner-detail { font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; }
  .concede-banner-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .concede-btn { flex: 1 1 120px; padding: 12px 6px; font-size: 0.92rem; font-weight: 700; border-radius: 8px; border: none; cursor: pointer; }
  .concede-yes { background: var(--green); color: #fff; }
  .concede-no { background: #fff; color: var(--green-dark); border: 1.5px solid var(--green); }
  /* Small badge marking a hole filled in by a concession rather than actually
     played out — distinct from the tie badge above. */
  .prog-conceded { position: absolute; top: -6px; right: -4px; width: 15px; height: 15px; border-radius: 50%; background: var(--muted); color: #fff; border: 1.5px solid #fff; font-size: 0.6rem; font-weight: 800; line-height: 12px; }
  /* Shown once every segment of a match has no holes left blank — final
     result plus a button to move on to the Scoreboard. Green (not the
     concede banner's amber) since this is a completed, not a pending,
     state. */
  .final-results-banner { background: #e8f2ec; border: 2px solid var(--green); border-radius: 10px; padding: 14px; margin: 10px 0 14px; text-align: center; }
  .final-results-title { font-weight: 800; color: var(--green-dark); font-size: 1.05rem; margin-bottom: 4px; }
  .final-results-score { font-size: 1.15rem; font-weight: 700; color: var(--green-dark); margin-bottom: 12px; }
  .final-results-banner .primary { width: 100%; padding: 14px 10px; font-size: 0.95rem; }
  /* First-thing-you-see gate: are you keeping score, or just here to watch?
     Covers the whole page (rather than living inside a tab) so it's the very
     first thing anyone opening this link sees, before either tab is usable. */
  .entry-gate { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .entry-gate-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 26px 22px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,0.12); }
  .entry-gate-card h2 { margin: 0 0 4px; color: var(--green-dark); font-size: 1.15rem; }
  .entry-gate-card .hint { font-size: 0.9rem; margin: 4px 0 18px; }
  .entry-gate-choice { display: flex; flex-direction: column; gap: 10px; }
  .entry-gate-choice button { padding: 14px 10px; font-size: 1rem; }
  .entry-gate-pin .row { justify-content: center; margin-bottom: 8px; }
  .entry-gate-pin input { font-size: 1.1rem; padding: 10px 12px; width: 130px; text-align: center; }
  .entry-gate-linklike { background: none; border: none; color: var(--green); text-decoration: underline; cursor: pointer; font-size: 0.85rem; padding: 6px; margin-top: 6px; }
</style>
</head>
<body>

<!-- ENTRY GATE — shown first, before either tab, so every visitor says up
     front whether they're keeping score (and gets routed straight to their
     match by PIN) or just watching (and goes straight to the Scoreboard). -->
<div id="entryGate" class="entry-gate">
  <div class="entry-gate-card">
    <h2>Heritage Legends Tournament</h2>
    <div id="entryGateChoice">
      <p class="hint">Are you keeping score for a match, or just checking the Scoreboard?</p>
      <div class="entry-gate-choice">
        <button type="button" class="primary" onclick="chooseScorekeeper()">I'm a Scorekeeper</button>
        <button type="button" class="secondary" onclick="chooseViewer()">Just Viewing the Scoreboard</button>
      </div>
    </div>
    <div id="entryGatePin" class="entry-gate-pin" hidden>
      <p class="hint">Enter your match's Scorekeeper PIN.</p>
      <div class="row">
        <input type="text" inputmode="numeric" id="gatePinInput" placeholder="PIN" maxlength="8">
        <button type="button" class="primary" onclick="submitGatePin()">Continue</button>
      </div>
      <div id="gatePinError" class="hint" style="color:var(--error); min-height:1.2em;"></div>
      <button type="button" class="entry-gate-linklike" onclick="chooseViewer()">I don't have a PIN — just viewing</button>
    </div>
  </div>
</div>

<header>
  <div>
    <h1 id="tournamentTitle">Heritage Legends Tournament</h1>
    <div class="sub">Live Scoring &amp; Scoreboard</div>
  </div>
  <div class="sub" id="envBadge"></div>
</header>
<nav>
  <button class="tab-btn active" data-tab="scoring">Live Scoring</button>
  <button class="tab-btn" data-tab="scoreboard">Scoreboard</button>
</nav>

<main>

  <!-- LIVE SCORING -->
  <section id="tab-scoring" class="tab-panel">
    <div class="card">
      <h2>Enter Scores</h2>
      <p class="sc-intro-label">1. Pick the day and your match from the drop-down window below.</p>
      <div class="row">
        <select id="scDay"><option value="1">Day 1</option><option value="2">Day 2</option></select>
        <select id="scMatch"></select>
        <span id="saveIndicator" class="save-indicator"></span>
      </div>
      <div class="row" id="scModeToggle" style="margin-top:4px;"></div>
      <div id="scStatusLines"></div>
      <div class="row" id="scViewToggle" style="margin-top:4px;"></div>
      <div id="scGridWrap"></div>
    </div>
  </section>

  <!-- SCOREBOARD -->
  <section id="tab-scoreboard" class="tab-panel" hidden>
    <div class="card">
      <div class="row" id="sbViewToggle">
        <button type="button" class="view-toggle-btn active" data-sbview="leaderboard" onclick="setSbView('leaderboard')">Leaderboard</button>
        <button type="button" class="view-toggle-btn" data-sbview="scorecards" onclick="setSbView('scorecards')">All Match Scorecards</button>
        <button type="button" class="view-toggle-btn" data-sbview="individual" onclick="setSbView('individual')">Individual Results</button>
      </div>
      <div class="row" style="justify-content:space-between;">
        <select id="sbDay"></select>
        <button class="secondary" onclick="loadScoreboard()">Update</button>
      </div>

      <div id="sbLeaderboard"></div>

      <div id="sbScorecards" hidden>
        <div id="sbScorecardsBody"></div>
      </div>

      <div id="sbIndividual" hidden></div>
    </div>
  </section>

</main>

<script>
// ====================== CONFIG ======================
const CONFIG = {
  test: { backendUrl: 'https://script.google.com/macros/s/AKfycbzw4xeOOwP09RCrILvt5P9iT9S8mpJXLzggO7NrzvEQy-bR-Qtn1-1tEfbEzeRTpQ/exec', key: '8O`I!r5]Hx26' },
  live: { backendUrl: 'https://script.google.com/macros/s/AKfycbwHLboebZV_xW_l6BLgK7FlMWucGc0DwU4mg2t3X91sCYpDPWLJV0BScPiM-SPah8gbyg/exec', key: '&wW3d@j>3£56' },
};
const envParam = new URLSearchParams(location.search).get('env');
const ENV = (envParam === 'test' || envParam === 'live') ? envParam : (location.href.toLowerCase().includes('test') ? 'test' : 'live');
const CFG = CONFIG[ENV];
// Regenerate this from the admin page's "Copy Tournament Snapshot" button
// (Settings tab) before match day, and paste the whole block — start marker,
// the const, and end marker — over this one, in BOTH this file and
// index.html. It's exactly the shape apiGet('getBootData') returns. Once
// pairings/rosters/PINs are finalized, this lets a phone's very first login
// paint instantly from data already sitting in the page instead of waiting
// on Google — the biggest help right at the moment everyone opens the app
// at once. It only covers settings/roster/pairings/PINs, never live scores,
// so nothing about mid-round play depends on it, and an out-of-date

// ====================== API HELPERS ======================
// The backend's save_* actions this page calls (saveMatchScores_ chief among
// them) wait on a shared lock for up to 10s before giving up — a plain,
// un-timed fetch() can then sit open far longer than that on a weak course
// connection with no controlled way to react, and either hangs the UI or
// eventually gets killed by the browser/OS with a bare "Failed to fetch"
// that's indistinguishable from every other kind of failure. Every call here
// goes through this instead, with a healthy margin above that 10s, so a
// stuck request reliably gives up (and can be retried — see
// saveCurrentMatch) well before that happens.
const FETCH_TIMEOUT_MS = 20000;
// Reads (GETs) get their own, longer timeout — see apiGet below for why a
// tighter one can actually make real concurrent-load slowness worse rather
// than better.
const GET_TIMEOUT_MS = 35000;
async function fetchWithTimeout(url, options, timeoutMs) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs || FETCH_TIMEOUT_MS);
  try {
    return await fetch(url, Object.assign({}, options, { signal: controller.signal }));
  } finally {
    clearTimeout(timer);
  }
}
// GETs never change anything server-side, so — unlike apiPost, which leaves
// retrying to whichever caller knows it's safe to repeat that particular
// action (see saveCurrentMatch) — it's always safe for apiGet to quietly
// retry on its own. loadShared() below fires it (now just once, via
// getBootData) at boot; a slow answer used to be enough to fail the whole
// load and leave the entry gate stuck on "Checking…" until the page was
// reloaded — this closes that gap at the source instead of relying on the
// person to notice and retry.
//
// The timeout here is deliberately longer than a POST's (35s vs. 20s) and
// the backoff between attempts has some randomness (jitter) mixed in. Both
// of those are specifically about the tournament-day scenario of several
// phones loading at once: these reads don't take a lock, so a slow one just
// means Apps Script itself is busy, not stuck — cutting it off too early and
// firing a retry doesn't relieve that load, it adds another request
// competing for the same busy backend. A longer timeout gives an
// already-in-flight request more room to just finish; jitter keeps several
// phones that all timed out at the same moment from all retrying in the same
// instant and re-colliding.
async function apiGet(action, extra) {
  const params = new URLSearchParams(Object.assign({ action, key: CFG.key }, extra || {}));
  const url = CFG.backendUrl + '?' + params.toString();
  const maxAttempts = 3;
  let lastError;
  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    try {
      const res = await fetchWithTimeout(url, undefined, GET_TIMEOUT_MS);
      return await res.json();
    } catch (e) {
      lastError = e;
      if (attempt < maxAttempts) await new Promise((r) => setTimeout(r, 500 * attempt + Math.random() * 500));
    }
  }
  throw lastError;
}
async function apiPost(action, body) {
  const res = await fetchWithTimeout(CFG.backendUrl, { method: 'POST', body: JSON.stringify(Object.assign({ action, key: CFG.key }, body || {})) });
  return res.json();
}

// and `red` (Red tees only, which play to a different Stroke Index on this
// course). Each is {hole: strokeIndex}.
let settings = {}, roster = [], holeHC = { default: {}, red: {} };
let pairings = { 1: [], 2: [] };
let matchPins = []; // [{MatchNum, PIN}] x9 — one Scorekeeper PIN per match number, shared by both days

function indexRoster() {

}

// Which Stroke Index table a player's tee should use — Red tees get their own
// table, everything else (Gold, White, Blue, blank, ...) shares the main one.
function strokeIndexForTee(tee, hole) {
  const isRed = (tee || '').trim().toLowerCase() === 'red';
  const table = isRed ? holeHC.red : holeHC.default;
  const row = table ? table[hole] : undefined;
  return row ? row.StrokeIndex : undefined;
}
// Par doesn't change by tee, so it only lives in the default table.
function parForHole(hole) {
  const row = holeHC.default ? holeHC.default[hole] : undefined;
  return row ? row.Par : '';
}
// Course Handicap = Handicap Index x (Slope/113) + (Course Rating - Par),
// per this course's own rating/slope for each tee (Par 72 both tees):
//   Red:  Slope 111, Rating 64.1
//   Gold: Slope 120, Rating 67.1 (also used for any tee other than Red)
// This is what actually gets used for strokes everywhere — matches the same
// formula in index.html so Roster, print, and live scoring never disagree.
function courseHandicap(handicapIndex, tee) {
  const idx = parseFloat(handicapIndex);
  if (isNaN(idx)) return '';
  const isRed = (tee || '').trim().toLowerCase() === 'red';
  const ch = isRed ? (idx * 111 / 113 + (64.1 - 72)) : (idx * 120 / 113 + (67.1 - 72));
  return Math.round(ch);
}

// strokes a player receives on one hole, from their Course Handicap
function strokesOnHole(handicapIndex, strokeIndex) {
  const hc = parseFloat(handicapIndex);
  const si = parseInt(strokeIndex, 10);
  if (isNaN(hc) || isNaN(si) || hc <= 0) return 0;
  const rounded = Math.round(hc);
  const base = Math.floor(rounded / 18);
  const extra = (si <= (rounded % 18)) ? 1 : 0;
  return base + extra;
}
// Winner fields are stored directly as 'A' | 'B' | 'Half' | 'Conceded' | ''
// (not yet entered) — this normalizes that into a
// 'A'|'B'|'Half'|'Conceded'|'pending' shape so every downstream tally/display
// helper (buildSegmentResult, progressionStripHtml, …) has a single
// consistent vocabulary to work with, blank/undefined included. 'Conceded' is
// the sentinel written into remaining blank holes when a player concedes an
// already-decided segment (see concedeSegment) — it counts as "decided" for
// tallying purposes without awarding either side a hole.
function normalizeWinner(w) {
  return (w === 'A' || w === 'B' || w === 'Half' || w === 'Conceded') ? w : 'pending';
}
// Last-known-good cache for settings/roster/pairings/handicaps/PINs — the
// slow-changing setup data, never live scores (those always need a real
// fetch — see onScMatchSelected — since showing a stale score would be worse
// than a brief wait for a correct one). Deliberately scoped per environment
// (test vs live) so testing on ?env=test can never leak into, or get
// overwritten by, the real tournament's cached data or vice versa.
const SHARED_CACHE_KEY = 'legendsSharedCache_' + ENV;
function loadCachedShared_() {
  try {
    const raw = localStorage.getItem(SHARED_CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function saveCachedShared_(bootData) {
  try {
    localStorage.setItem(SHARED_CACHE_KEY, JSON.stringify(bootData));
  } catch (e) { /* storage full/unavailable — page still works, just without an instant paint next load */ }
}
// Applies a boot-data snapshot — in the same raw shape apiGet('getBootData')
// returns — to the shared module state and the bits of UI that don't need
// anything else to have run first. One function, one shape, used
// identically no matter which of the three sources it came from: this
// device's own last-known-good cache, the EMBEDDED_SNAPSHOT baked into this
// file, or a fresh live fetch (see loadShared below) — so there's exactly
// one place that knows how to turn boot data into on-screen state.
function applySharedSnapshot_(d) {
  if (!d) return;
  if (d.settings) { settings = d.settings; document.getElementById('tournamentTitle').textContent = settings.TournamentName || 'Heritage Legends Tournament'; applyTeamColorVars(); }
  if (d.roster) { roster = d.roster; indexRoster(); }
  if (d.holeHandicaps) {
    holeHC.default = {};
    d.holeHandicaps.forEach((row) => { if (row.Hole) holeHC.default[row.Hole] = { StrokeIndex: row.StrokeIndex, Par: row.Par }; });
  }
  if (d.holeHandicapsRed) {
    holeHC.red = {};
    d.holeHandicapsRed.forEach((row) => { if (row.Hole) holeHC.red[row.Hole] = { StrokeIndex: row.StrokeIndex }; });
  }
  if (d.pairings1) pairings['1'] = d.pairings1;
  if (d.pairings2) pairings['2'] = d.pairings2;
  if (d.matchPins) matchPins = d.matchPins;
}
// Used to fire 7 separate apiGet calls in parallel (getSettings, getRoster,
// both hole-handicap tables, both days' pairings, getMatchPins) — measured
// at ~16s on a live test. Each one makes the backend open the Spreadsheet by
// ID from scratch before it can read anything, and Apps Script's own
// per-project concurrency limits mean "7 in parallel" isn't really parallel
// server-side. A single getBootData action (added to Code.gs alongside that
// change) bundles all 7 into one request/one spreadsheet open, cutting a
// ~16s load down to roughly what one of those 7 used to take on its own.
async function loadShared() {
  const res = await apiGet('getBootData');
  if (!res.success) throw new Error(res.error || 'Could not load tournament data');
  applySharedSnapshot_(res.data);
  // Cache this fresh snapshot for next time — purely a head start for the
  // NEXT page load (see boot() below); this fetch always runs regardless of
  // what was painted from cache or EMBEDDED_SNAPSHOT, and its result always
  // wins over both.
  saveCachedShared_(res.data);
}

// last name to keep things short — but when two players on the roster share
// a last name (e.g. two Davises), that alone is ambiguous, so a first
// initial is appended for BOTH of them: "Davis J" / "Davis L". Anyone whose
// last name is unique still shows as plain "Davis". Duplicates are computed
// fresh from the current roster on every call (the roster is small, so this
// is cheap) rather than cached, so it stays correct if the roster changes.
// Doesn't further disambiguate two players who'd ALSO share a first initial
// (e.g. "Davis, Jay" and "Davis, James") — rare enough not to handle here;
// use a Roster nickname-style edit if that ever comes up.
function lastNameRaw_(name) {
  if (!name) return '';
  const idx = name.indexOf(',');
  return (idx === -1 ? name : name.slice(0, idx)).trim();

function duplicateLastNames_() {
  const counts = {};
  (roster || []).forEach((p) => {
    const ln = lastNameRaw_(p.Name);
    if (!ln) return;
    const key = ln.toLowerCase();
    counts[key] = (counts[key] || 0) + 1;
  });
  const dupes = new Set();
  Object.keys(counts).forEach((k) => { if (counts[k] > 1) dupes.add(k); });

  if (!name) return '?';
  const ln = lastNameRaw_(name);
  if (!ln) return name;
  if (!duplicateLastNames_().has(ln.toLowerCase())) return ln;
  const idx = name.indexOf(',');
  const first = idx === -1 ? '' : name.slice(idx + 1).trim();
  const initial = first ? first.charAt(0).toUpperCase() : '';
  return initial ? `${ln} ${initial}` : ln;
}

let inFlightSaves = {};

// from one that's actually landed in the sheet. See holeSaveState below.
let lastSavedHolesByMatch = {};

let concedeBannerFor = null;

// been dismissed by tapping that button — keyed 'day_matchNum'. Plain
// in-memory state, not persisted: a fresh page load shows the banner again
// for any match that's still complete, which is fine (there's nothing left
// to accidentally re-enter once every hole is final).
let acceptedMatches = new Set();

// ---- CLOSEST TO THE PIN: placard pickup alert ----
// Placards sit on the 4 par-3s (5, 8, 12, 17); whichever group plays a given
// par-3 LAST that day is the one that should collect it and drop it at the
// pro shop. On a shotgun start every group plays 18 holes starting from its
// own Start Hole and wrapping back around, so the group that plays hole T
// last is whichever group's Start Hole is the very next one actually used,
// going forward from T (wrapping 18 -> 1) — that next hole is the START of
// their day, which makes T the END of it (their 18th hole played). This
// works for any shotgun arrangement, including one that skips holes entirely
// (not every hole has a group teeing off there) and one with a doubled-up
// tee (e.g. "18a"/"18b" both starting on 18 a few minutes apart) — in the
// doubled-up case both matches come back as responsible, which just means
// the alert can pop up for either.
const CLOSEST_TO_PIN_HOLES = [5, 8, 12, 17];
// Fires at most once per (day, matchNum, hole) per page load, even if that
// hole's result gets saved again later (a correction, a retried autosave) —
// keyed 'day_matchNum_hole'. Plain in-memory state, not persisted; a fresh
// page load can show it again, which is fine since it only pops up for
// whichever match is actually responsible, when it actually completes that
// hole.
let placardAlerted = new Set();
function ctpResponsibleMatchNums(day, targetHole) {
  const starts = (pairings[day] || [])
    .filter((r) => hasPlayersLb(r) && r.StartHole)
    .map((r) => ({ matchNum: String(r.MatchNum), start: startHoleNumberOf(r.StartHole) }))
    .filter((x) => x.start !== null);
  if (!starts.length) return [];
  // Steps forward from targetHole to reach start hole s (1..18, never 0 —
  // a group starting ON targetHole plays it FIRST, not last, so it's
  // deliberately the worst-ranked candidate, not the best).
  const distForward = (s) => ((s - targetHole - 1 + 18) % 18) + 1;
  let best = Infinity;
  starts.forEach((x) => { const d = distForward(x.start); if (d < best) best = d; });
  return starts.filter((x) => distForward(x.start) === best).map((x) => x.matchNum);
}
// Whether `holeRow` (0-based idx into the 18-hole grid) already carries a
// real result for CTP purposes — mirrors how each mode actually records a
// hole: Day 1 and Day 2's front 9 (Best Ball) each have one Winner-style
// field for the whole group; Day 2's back 9 runs two separate Individual
// Match Play results (MP1Winner/MP2Winner) for the same physical hole, so
// either one counts (they're entered together, behind one Save button).
function holeIsCompletedForCTP(day, holeRow, idx) {
  if (!holeRow) return false;
  if (day === '2' || day === 2) {
    return idx <= 8 ? !!holeRow.BestBallWinner : !!(holeRow.MP1Winner || holeRow.MP2Winner);
  }
  return !!holeRow.Winner;
}
// Called right after a save of `holes` for (day, matchNum) is confirmed
// written to the sheet — see saveCurrentMatch. Compares against `prevHoles`
// (the last confirmed-saved snapshot, from BEFORE this save) so the alert
// only fires the moment a placard hole newly gets a result, not on every
// later resave of a match that already finished it.
function checkPlacardPickup(day, matchNum, prevHoles, holes) {
  CLOSEST_TO_PIN_HOLES.forEach((hole) => {
    const idx = hole - 1;
    const wasDone = holeIsCompletedForCTP(day, (prevHoles || [])[idx], idx);
    const isDone = holeIsCompletedForCTP(day, holes[idx], idx);
    if (wasDone || !isDone) return; // not a fresh completion of this hole
    const key = day + '_' + matchNum + '_' + hole;
    if (placardAlerted.has(key)) return;
    if (!ctpResponsibleMatchNums(day, hole).includes(String(matchNum))) return;

  const { segs } = segmentInfoFromHoles(day, pairingRow, holes);
  const names = teamNames();

  segs.forEach((s) => { ptsA += s.points.A; ptsB += s.points.B; });

      : `Match tied, ${formatPts(ptsA)}–${formatPts(ptsB)}`;

    <div class="final-results-banner">

      <div class="final-results-score">${resultText}</div>
      <button type="button" class="primary" onclick="acceptMatchResults('${day}', '${matchNum}')">Accept Results of Match ${escapeHtml(String(matchNum))} and go to Scoreboard</button>

}
function cloneHoles(holes) { return JSON.parse(JSON.stringify(holes || [])); }
function fieldsForDay(day) { return day === '2' ? ['BestBallWinner', 'MP1Winner', 'MP2Winner'] : ['Winner']; }
// 'empty' — no result entered at all; 'saved' — matches the last confirmed-
// saved snapshot; 'unsaved' — has a result that differs from (or isn't yet
// in) that snapshot, i.e. entered here but not confirmed written to the
// sheet yet (still mid-autosave-debounce, or the save hasn't been retried
// since an error).
function holeSaveState(day, matchNum, idx) {
  const holeRow = currentHoles[idx];
  if (!holeRow) return 'empty';
  const fields = fieldsForDay(day);
  const hasValue = fields.some((f) => holeRow[f]);
  if (!hasValue) return 'empty';
  const saved = (lastSavedHolesByMatch[day + '_' + matchNum] || [])[idx];
  const matchesSaved = saved && fields.every((f) => String(saved[f] || '') === String(holeRow[f] || ''));
  return matchesSaved ? 'saved' : 'unsaved';
}
// Compares what was just POSTed against what the server handed back right
// after writing it (saveMatchScores_ returns the sheet's own post-write rows
// for this match) — catches the sheet silently not ending up with what we
// think we sent (a write that got clobbered, a lock/quota hiccup Apps Script
// swallowed, etc.) instead of trusting a bare "success" from the API call.
function holesMatchServerRows(day, sentHoles, serverRows) {
  const byHole = {};
  (serverRows || []).forEach((r) => { byHole[r.Hole] = r; });
  const fields = fieldsForDay(day);
  return sentHoles.every((h) => {
    const r = byHole[h.Hole] || {};
    return fields.every((f) => String(r[f] || '') === String(h[f] || ''));
  });
}

// ---- per-match PIN gate ----
// A match's Scorekeeper PIN (set by the admin on the Scorekeeper PINs tab) is
// optional — blank means anyone with this link can still enter that match's
// scores, same as before this existed. It's one PIN per match NUMBER, shared
// by both days, so entering it once unlocks that match on Day 1 and Day 2
// both. When set, this device has to enter it once; it's then remembered
// here (localStorage) so the same phone doesn't have to re-enter it every
// time. This only gates the score-ENTRY UI — the Scoreboard tab is
// unaffected and stays open/read-only to everyone regardless.
// A PIN typed with a leading zero (e.g. "0007") can end up mismatching a
// stored value that lost that zero somewhere upstream — most commonly a PIN
// typed straight into the Google Sheet's MatchPins tab instead of through
// this app's own PIN box, where Sheets' own auto-formatting can silently
// turn "0007" into the number 7 before this app ever reads it back (the
// String(...) coercion elsewhere just stops that from crashing the page; it
// can't restore a zero that's already gone). Treating two all-digit PINs as
// the same whenever they're numerically equal — not just textually
// identical — means a scorekeeper handed "0007" isn't locked out by that
// kind of drift, however it happened.
function pinsMatch(entered, required) {
  if (!entered || !required) return false;
  if (entered === required) return true;
  return /^\d+$/.test(entered) && /^\d+$/.test(required) && Number(entered) === Number(required);
}
// A match number's shared PIN, looked up from the MatchPins sheet — the same
// value applies to that match number on both Day 1 and Day 2.
function pinForMatch(matchNum) {
  const row = matchPins.find((r) => String(r.MatchNum) === String(matchNum));
  return row ? String(row.PIN || '').trim() : '';
}
function pinStorageKey(matchNum) { return `legends_pin_${ENV}_${matchNum}`; }
function getStoredPin(matchNum) {
  try { return localStorage.getItem(pinStorageKey(matchNum)); } catch (e) { return null; }
}
function storePin(matchNum, pin) {
  try { localStorage.setItem(pinStorageKey(matchNum), pin); } catch (e) {}
}
// ---- admin bypass ----
// Entering the same Admin PIN used to unlock the admin page (Settings →
// Admin PIN) into ANY match's lock screen unlocks every match on this
// device, not just that one — so the admin doesn't need each foursome's
// individual code to jump in and fix or enter a score. Stored once, device-
// wide, separately from any per-match PIN this device may also remember.
function adminUnlockKey() { return `legends_admin_${ENV}`; }
function getAdminUnlocked() {
  try { return localStorage.getItem(adminUnlockKey()) === '1'; } catch (e) { return false; }
}
function setAdminUnlocked(v) {
  try { v ? localStorage.setItem(adminUnlockKey(), '1') : localStorage.removeItem(adminUnlockKey()); } catch (e) {}
}
// Mirrors suspendPinsOn() in index.html.
function suspendPinsOn() {
  const v = settings && settings.SuspendScorePins;
  return v === true || v === 'TRUE' || v === 'true';
}
// Mirrors concedeEnabled() in index.html. Defaults ON (existing behavior)
// unless the admin has explicitly turned it off in Settings.
function concedeEnabled() {
  const v = settings && settings.ConcedeEnabled;
  return !(v === false || v === 'FALSE' || v === 'false');
}
function matchIsUnlocked(matchNum) {
  if (suspendPinsOn()) return true; // testing mode — Settings → Suspend PIN Requirement
  if (getAdminUnlocked()) return true;
  const requiredPin = pinForMatch(matchNum);
  if (!requiredPin) return true; // no PIN set for this match — open to anyone
  return pinsMatch(getStoredPin(matchNum), requiredPin);
}

document.getElementById('scDay').addEventListener('change', onScDayOrMatchChange);
document.getElementById('scMatch').addEventListener('change', onScMatchSelected);

function populateMatchDropdown() {
  const day = document.getElementById('scDay').value;
  const sel = document.getElementById('scMatch');
  sel.innerHTML = '';
  pairings[day].forEach((row) => {
    const opt = document.createElement('option');
    opt.value = row.MatchNum;
    opt.textContent = matchLabel(day, row);
    sel.appendChild(opt);
  });
}
// Switching the Day dropdown used to silently reset the Match dropdown back
// to Match 1 (populateMatchDropdown rebuilds it from scratch, and a rebuilt
// <select> defaults to its first option) instead of staying on whatever
// match number was already selected. Since a Scorekeeper PIN now unlocks one
// match NUMBER across both days, that reset made switching to Day 2 look
// like it demanded a second PIN — really it had quietly jumped to Match 1
// (someone else's match, usually still locked), not asked twice for the same
// one. Restoring the same match number here is what makes "enter it once"
// actually hold across the Day tab.
function onScDayOrMatchChange() {
  const prevMatchNum = document.getElementById('scMatch').value;
  populateMatchDropdown();
  const sel = document.getElementById('scMatch');
  if (prevMatchNum && Array.from(sel.options).some((o) => o.value === prevMatchNum)) {
    sel.value = prevMatchNum;
  }
  onScMatchSelected();
}
async function onScMatchSelected() {
  const day = document.getElementById('scDay').value;
  const matchNum = document.getElementById('scMatch').value;
  scHoleIndex = 0;
  concedeBannerFor = null;
  if (!matchNum) { currentHoles = []; renderScoringUI(day, matchNum); return; }
  const res = await apiGet('getScores', { day });
  const rows = res.success ? res.data.filter((r) => String(r.MatchNum) === String(matchNum)) : [];
  currentHoles = buildHoleGrid(day, matchNum, rows);
  // Whatever just came back from the sheet is, by definition, already saved —
  // seed the baseline the per-hole indicator strip compares against so every
  // hole loaded this way starts out reading as "saved," not "unsaved."
  if (res.success) lastSavedHolesByMatch[day + '_' + matchNum] = cloneHoles(currentHoles);
  const pairingRow = pairings[day].find((r) => String(r.MatchNum) === String(matchNum));
  // Jump straight to the first hole that still needs a result, so a
  // scorekeeper picking up mid-round doesn't have to page through
  // already-entered holes. Search starts at this match's own Start Hole and
  // wraps around 1..18 — a shotgun match starting at, say, hole 13 lands on
  // hole 13 (not hole 1, which for that match hasn't been played yet and
  // never will read as "done"). Falls back to the start hole itself if
  // everything's blank or everything's already entered.
  const startNum = startHoleNumberOf(pairingRow && pairingRow.StartHole) || 1;
  const startIdx = startNum - 1;
  let firstBlankIdx = startIdx;
  for (let i = 0; i < 18; i++) {
    const idx = (startIdx + i) % 18;
    if (holeIsBlank(day, currentHoles[idx])) { firstBlankIdx = idx; break; }
  }
  scHoleIndex = firstBlankIdx;
  renderScoringUI(day, matchNum);
}

function holeIsBlank(day, holeRow) {
  if (day === '2') {
    return holeRow.Hole <= 9 ? !holeRow.BestBallWinner : !(holeRow.MP1Winner && holeRow.MP2Winner);
  }
  return !holeRow.Winner;
}

function buildHoleGrid(day, matchNum, existingRows) {
  const byHole = {};
  existingRows.forEach((r) => { byHole[r.Hole] = r; });
  const holes = [];
  for (let h = 1; h <= 18; h++) {
    const r = byHole[h] || {};
    if (day === '2') {
      holes.push({ Hole: h, BestBallWinner: r.BestBallWinner || '', MP1Winner: r.MP1Winner || '', MP2Winner: r.MP2Winner || '' });
    } else {
      holes.push({ Hole: h, Winner: r.Winner || '' });
    }
  }
  return holes;
}

// Top-level dispatcher: once a match is picked and unlocked, shows either the
// one-hole-at-a-time entry view or the "Enter Match Winner" segment-level
// view, per scEntryMode (see scModeToggleHtml/setScEntryMode).
function renderScoringUI(day, matchNum) {
  const toggleEl = document.getElementById('scViewToggle');
  const modeEl = document.getElementById('scModeToggle');
  if (!matchNum) {
    toggleEl.innerHTML = '';
    if (modeEl) modeEl.innerHTML = '';
    document.getElementById('scGridWrap').innerHTML = '<p class="hint">Set up this match\'s pairing first (Admin → Pairings) before entering scores.</p>';
    document.getElementById('scStatusLines').innerHTML = '';
    return;
  }
  if (!matchIsUnlocked(matchNum)) {
    toggleEl.innerHTML = '';
    if (modeEl) modeEl.innerHTML = '';
    renderPinLock(day, matchNum);
    return;
  }
  if (dayIsLocked(day)) {
    toggleEl.innerHTML = '';
    if (modeEl) modeEl.innerHTML = '';
    document.getElementById('scStatusLines').innerHTML = '';
    document.getElementById('scGridWrap').innerHTML = `
      <div class="card" style="margin:0; background:#fdecea; border-color:var(--error);">
        <p class="hint" style="margin-top:0; color:var(--error); font-weight:600;">Day ${escapeHtml(day)} results are locked by the admin — scores can no longer be changed. Check the Scoreboard tab for final results.${day === '1' ? ' To enter Day 2 results, click on the dropdown window above and select "Day 2."' : ''}</p>
      </div>
    `;
    return;
  }
  if (suspendPinsOn()) {
    // No PIN gate is actually active right now, so there's nothing to "Forget"
    // or "Exit" — just say so, rather than showing a button that wouldn't do
    // anything meaningful while this is on.
    toggleEl.innerHTML = '<span class="hint" style="margin-left:auto; color:#b8860b; font-weight:600;">Testing mode: PIN requirement is suspended for every match</span>';
  } else {
    toggleEl.innerHTML = getAdminUnlocked()
      ? `<button type="button" class="secondary" style="margin-left:auto;" onclick="exitAdminMode('${day}', '${matchNum}')">Exit Admin Mode</button>`
      : (pinForMatch(matchNum)
          ? `<button type="button" class="secondary" style="margin-left:auto;" onclick="lockMatch('${matchNum}')">Forget PIN</button>`
          : '');
  }
  if (modeEl) modeEl.innerHTML = scModeToggleHtml();
  renderCurrentEntryView(day, matchNum);
}

// Clears this device's remembered PIN for this match and re-shows the lock
// screen — for handing the phone to a different foursome, or if the wrong
// code got saved. (If the admin changes a match's PIN, this device is
// automatically re-locked next time it's selected — no need for this.)
function lockMatch(matchNum) {
  try { localStorage.removeItem(pinStorageKey(matchNum)); } catch (e) {}
  renderScoringUI(document.getElementById('scDay').value, matchNum);
}

// Turns off this device's admin bypass (see matchIsUnlocked) — every match
// goes back to needing either its own PIN or the Admin PIN again. Any
// per-match PINs this device separately remembered are untouched.
function exitAdminMode(day, matchNum) {
  setAdminUnlocked(false);
  renderScoringUI(day, matchNum);
}

// Shown instead of the scoring UI when this match has a PIN set and this
// device hasn't unlocked it yet.
function renderPinLock(day, matchNum) {
  document.getElementById('scStatusLines').innerHTML = '';
  const wrap = document.getElementById('scGridWrap');
  wrap.innerHTML = `
    <div class="card" style="margin:0; background:#fbf3e4; border-color:var(--gold);">
      <p class="hint" style="margin-top:0;">This match is protected — enter the PIN given to this foursome to enter scores. (The Scoreboard tab is still open to everyone.)</p>
      <div class="row">
        <input type="text" inputmode="numeric" id="matchPinInput" placeholder="PIN" maxlength="8" style="font-size:1.1rem; padding:10px 12px; width:120px;">
        <button type="button" class="primary" onclick="tryUnlockMatch('${day}', '${matchNum}')">Unlock</button>
      </div>
      <div id="pinError" class="hint" style="color:var(--error);"></div>
    </div>
  `;
  const input = document.getElementById('matchPinInput');
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlockMatch(day, matchNum); });
  input.focus();
}
function tryUnlockMatch(day, matchNum) {
  const entered = document.getElementById('matchPinInput').value.trim();
  const requiredPin = pinForMatch(matchNum);
  const adminPin = String((settings && settings.AdminPIN) || '').trim();
  if (adminPin && pinsMatch(entered, adminPin)) {
    // The Admin PIN unlocks every match on this device, not just this one.
    setAdminUnlocked(true);
    renderScoringUI(day, matchNum);
  } else if (entered && requiredPin && pinsMatch(entered, requiredPin)) {
    // One shared PIN per match number, covering both days — storing it once
    // here unlocks this same match number on the other day too, no matter
    // which day's screen it was typed into.
    storePin(matchNum, entered);
    renderScoringUI(day, matchNum);
  } else {
    document.getElementById('pinError').textContent = 'Incorrect PIN — check with your foursome or the admin.';
  }

// ---- direct hole-winner tap UI (replaces gross-score entry) ----
// The scorekeeper works out who actually won the hole (using the stroke
// hints below each side's name to judge net results fairly) and taps that
// side, or Tie — no gross strokes are typed in anywhere.
function lastNameOrUnassigned(name) { return name ? lastName(name) : '(unassigned)'; }
function playerStrokeNoteHtml(name, hole) {
  const p = rosterByName[name];
  if (!p) return '';
  const si = strokeIndexForTee(p.Tee, hole);
  const strokes = strokesOnHole(courseHandicap(p.HandicapIndex, p.Tee), si);
  if (strokes <= 0) return '';
  return `<div class="hbh-stroke-note">${escapeHtml(lastName(name))}: gets ${strokes} stroke${strokes > 1 ? 's' : ''}<span class="hbh-dot"></span></div>`;
}
// Button text: the Tie button just says "Tie"; each side's own button says
// "<name> Wins" so the row is self-explanatory without a separate label line
// above it. Each side's own button is always shaded with that team's own
// color (not just once picked) — easier to tell the two sides apart at a
// glance for anyone who isn't used to the app; the button that's actually
// picked is marked with a bold border and a leading checkmark instead, since
// a color change alone wouldn't be visible against a background that's
// already colored either way.
// holeSuffix (optional, e.g. " Hole 5") is appended to every button's label —
// passed only by the hole-by-hole call sites below (teamWinnerBlockHtml /

// picks, since "Wins Hole 5" wouldn't make sense for a pick covering 9 holes.
function winnerButtonsHtml(field, val, aLabel, bLabel, extraBtnHtml, aColor, bColor, holeSuffix) {
  const suffix = holeSuffix || '';
  const btn = (v, rawLabel, cls, color) => {
    const isActive = val === v;
    const label = (isActive ? '✓ ' : '') + (v === 'Half' ? `${rawLabel}${suffix}` : `${rawLabel} Wins${suffix}`);
    const style = color ? ` style="background:${escapeHtml(color)};"` : '';
    return `<button type="button" class="wpick-btn ${isActive ? 'active ' + cls : ''}" data-wfield="${field}" data-wval="${v}"${style}>${escapeHtml(label)}</button>`;
  };
  return `<div class="wpick-row">${btn('A', aLabel, 'wpick-a', aColor)}${btn('Half', 'Tie', 'wpick-half')}${btn('B', bLabel, 'wpick-b', bColor)}${extraBtnHtml || ''}</div>`;
}
// Team-vs-team pick (Day 1 both segments, Day 2 Best Ball) — just the three
// buttons, since each button's own "<Team> Wins" text already says who it's
// for. extraBtnHtml (optional) is appended into the same button row — used
